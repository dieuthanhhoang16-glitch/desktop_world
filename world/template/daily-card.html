</div>

<!-- 三态生命周期控制组（v0.6.6，仅 live；默认 hidden，JS 检测 __worldLive 桥才解开） -->
<div class="lifecycle" id="lifeCtl" hidden>
  <button type="button" data-life="hide" title="收起到角落胶囊（番茄钟和随手记都继续活着）">—</button>
  <button type="button" data-life="settings" title="打开 Settings">⚙</button>
</div>
<!-- 胶囊：hidden 态唯一可见元素，点击展开（托盘/快捷键是另外两条等价路） -->
<div class="pill" id="lifePill" hidden></div>

<script>
(function () {
  // 模式拆分：bake = 烘焙壁纸（注入了 window.__REPORT__，保持卡片形态）；
  //           live = 动态桌面组件（无 __REPORT__，无卡片化 widget + 桌宠 + 随手记）
  var LIVE = !window.__REPORT__;
  document.body.className = LIVE ? 'live' : 'bake';

  // 星星只铺一次底；render 支持反复调用（live 桌面模式每 15 分钟热刷新）
  var starsEl = document.getElementById('stars');
  if (!starsEl.childElementCount) {
    for (var i = 0; i < 90; i++) {
      var s = document.createElement('i');
      s.style.left = (Math.random() * 100).toFixed(2) + '%';
      s.style.top = (Math.random() * 100).toFixed(2) + '%';
      s.style.opacity = (0.15 + Math.random() * 0.5).toFixed(2);
      starsEl.appendChild(s);
    }
  }

  var CAT_COLORS = { 学习: '#7dd3fc', 工作: '#4ade80', 生活: '#fbbf24', 开源: '#ff9ec6', 其他: '#9aa3c0' };
  var notesDate = null; // 随手记当前已加载的日期键（live 模式）
  var notesBodyEl = document.getElementById('notesBody');
  var lastR = null; // 最近一次渲染的完整报告（隐藏/恢复后的本地重绘用）
  var curRenderDate = null; // 当前渲染日期（隐藏会话 / 打开当日 md 的日期键）

  function todayKey() {
    var n = new Date();
    return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
  }

  // HTML 转义（renderPomo 与 render 共用；v0.6.3.3 之前它嵌在 render 里，
  // 点击「▶ 开始」开任务选择器时抛 esc is not defined，选择器只展开了一条空虚线）
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ---------- 番茄钟（UI 只是主进程状态的镜子；时钟与写盘全在主进程）----------
  var pomoView = null; // 最近一次主进程快照（render(R.pomo) 与 1Hz 轮询共用）
  var pomoPickOpen = false; // 任务选择器展开态（热刷新不打断正在选的人）

  function pomoDoneSids() {
    return (pomoView && pomoView.doneSids) || [];
  }

  function fmtMMSS(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }
  function fmtMin(ms) {
    var m = Math.round(ms / 60000);
    return m >= 60 ? (m / 60).toFixed(1) + 'h' : m + ' 分钟';
  }

  // techTips 可能是旧字符串，也可能是 v0.6.5 结构化考点对象——hover 全文排版统一在这做
  function fmtTip(t) {
    if (typeof t === 'string') return t;
    if (!t || typeof t !== 'object') return '';
    var lines = ['【考点】' + t.topic + (t.project ? '（来自项目：' + t.project + '）' : '')];
    if (t.answer) lines.push('标准答案：' + t.answer);
    if (t.hook) lines.push('记忆钩子：' + t.hook);
    if (t.action) lines.push('可操作方法：' + t.action);
    return lines.join('\n');
  }

  // ---------- 定向学习（v0.6.5；主进程聚合记忆与写盘，渲染层只做输入/选择/展示）----------
  var techGoalEls = document.getElementById('techGoals');
  var techInputEl = document.getElementById('techInput');
  var techPickEl = document.getElementById('techPick');
  var studyListEl = document.getElementById('studyList'); // 学习卡片（v0.7）
  var techInit = false; // render 每次热刷都会来，list 只拉一次（写盘后手动刷新）
  var studyInit = false; // 学习卡片同理，但独立标记（不能挂在 techInit 上，见 render 里的注释）
  var techBusy = false; // propose 在途拦截连击
  var techDirection = ''; // 本轮收敛的方向（选定关键词随它一起落盘）
  var techSelected = {}; // 候选点选态：keyword -> true

  function refreshTechGoals() {
    if (!window.__worldTech) return;
    window.__worldTech.list().then(function (res) {
      var goals = (res && res.goals) || [];
      techGoalEls.innerHTML = goals
        .map(function (g) {
          return (
            '<span class="tech-goal" title="' + esc(g.keywords.join('\n')) + '">' +
            esc(g.direction) + ' <b>×' + g.keywords.length + '</b></span>'
          );
        })
        .join('');
      // 关键词变了，学习卡片列表也要跟着重拉一次（新关键词可能还没建档）
      refreshStudyCards();
    });
  }

  // 学习卡片（v0.7）：列出每个关键词的卡片与进度，点开用系统默认程序打开对应 md。
  // 卡片可能还没建档（当天日报没跑过），所以 exists=false 时显示"待建档"而不是隐藏——
  // 让"配了关键词却什么都没发生"这件事在界面上是看得见的。
  var STUDY_ICON = { pending: '🧩', learning: '📌', settled: '🌳' };
  function refreshStudyCards() {
    if (!window.__worldStudy) return;
    window.__worldStudy.list().then(function (res) {
      var cards = (res && res.cards) || [];
      studyListEl.innerHTML = '';
      if (!cards.length) {
        studyListEl.innerHTML = '<div class="nohit">还没有学习卡片。配好定向学习关键词后，日报跑一次就会自动建档。</div>';
        return;
      }
      for (var i = 0; i < cards.length; i++) {
        (function (c) {
          var el = document.createElement('span');
          el.className = 'study-card';
          el.setAttribute('data-st', c.status || 'pending');
          el.setAttribute('role', 'button');
          el.setAttribute('tabindex', '0');
          var days = c.dayCount ? c.dayCount + ' 天' : '还没命中';
          var title =
            (c.direction || '') + ' · ' + (c.status || '') + '\n' +
            '关键词：' + c.keyword + '\n实证：' + days +
            (c.lastHit ? '（最近 ' + c.lastHit + '）' : '');
          el.setAttribute('title', title);
          el.innerHTML =
            '<span class="st">' + (STUDY_ICON[c.status] || '·') + '</span>' +
            '<span class="kw">' + esc(c.keyword) + '</span>' +
            '<span class="days">' + esc(days) + '</span>';
          if (!c.file) {
            // 还没建档：点不动，但要说清楚为什么
            el.style.opacity = '0.55';
            el.style.cursor = 'default';
          } else {
            el.addEventListener('click', function () { window.__worldStudy.open(c.file); });
            el.addEventListener('keydown', function (ev) {
              if (ev.key === 'Enter' || ev.key === ' ') {
                ev.preventDefault();
                window.__worldStudy.open(c.file);
              }
            });
          }
          studyListEl.appendChild(el);
        })(cards[i]);
      }
    });
  }

  function submitTechDirection() {
    if (!window.__worldTech || techBusy) return;
    var dir = (techInputEl.textContent || '').trim();
    if (!dir) return;
    techDirection = dir.slice(0, 40);
    techSelected = {};
    techBusy = true;
    techPickEl.hidden = false;
    techPickEl.innerHTML = '<span class="thint">结合最近 7 天项目回想候选中…</span>';
    window.__worldTech.propose(techDirection).then(function (res) {
      techBusy = false;
      var kws = (res && res.keywords) || [];
      if (!kws.length) {
        techPickEl.innerHTML = '<span class="thint">没想出候选词，换个更具体的说法再回车试试？</span>';
        return;
      }
      techPickEl.innerHTML =
        kws
          .map(function (kw) {
            return '<span class="cand" data-kw="' + esc(kw) + '">' + esc(kw) + '</span>';
          })
          .join('') +
        '<button class="save" type="button">✔ 确认这些方向</button>' +
        '<span class="thint">可多选；没选中的词不会收录；想换词改上面方向再回车</span>';
    });
  }

  function renderPomo(v) {
    pomoView = v || { phase: 'idle', remainMs: 0, totalMs: 0, task: null, cycles: 0, focusMs: 0, tasks: {}, doneSids: [] };
    var sec = document.getElementById('pomoSection');
    if (!sec) return;
    sec.style.display = '';
    var clock = document.getElementById('pomoClock');
    var task = document.getElementById('pomoTask');
    var count = document.getElementById('pomoCount');
    var btns = document.getElementById('pomoBtns');
    var barWrap = document.getElementById('pomoBarWrap');
    var bar = document.getElementById('pomoBar');
    var ph = pomoView.phase;
    var running = ph === 'focus' || ph === 'break';
    var paused = ph === 'focus-paused' || ph === 'break-paused';

    sec.classList.toggle('rest', ph.indexOf('break') === 0);
    clock.classList.toggle('paused', paused);
    clock.textContent = running || paused ? fmtMMSS(pomoView.remainMs) : '';
    task.textContent = running || paused
      ? (ph.indexOf('break') === 0 ? '休息一下 ☕' : ('· ' + (pomoView.task ? pomoView.task.title : '自由专注')))
      : '开始一个番茄';
    count.textContent = pomoView.cycles ? '×' + pomoView.cycles : '';

    var b = [];
    if (ph === 'idle') {
      b.push('<button class="p-btn primary" data-act="pick" type="button">▶ 开始</button>');
    } else if (paused) {
      b.push('<button class="p-btn primary" data-act="resume" type="button">▶ 继续</button>');
      b.push('<button class="p-btn" data-act="skip" type="button">⏭ 跳过</button>');
    } else {
      b.push('<button class="p-btn" data-act="pause" type="button">⏸ 暂停</button>');
      b.push('<button class="p-btn" data-act="skip" type="button">⏭ 跳过</button>');
    }
    btns.innerHTML = b.join('');

    if (running || paused) {
      barWrap.hidden = false;
      var frac = pomoView.totalMs > 0 ? 1 - pomoView.remainMs / pomoView.totalMs : 0;
      bar.style.width = (Math.max(0, Math.min(1, frac)) * 100).toFixed(1) + '%';
    } else {
      barWrap.hidden = true;
    }

    // 任务选择器（idle 点「开始」后展开）：进行中会话卡 + 自由任务 + 不关联
    var picker = document.getElementById('pomoPicker');
    if (pomoPickOpen && ph === 'idle') {
      picker.hidden = false;
      var ses = ((lastR && lastR.digest && lastR.digest.sessions) || []).filter(function (s) {
        return s.status === '进行中' && !s.hidden && s._sid;
      });
      var html = ses.map(function (s, i) {
        return '<div class="p-opt" data-pick-sid="' + esc(s._sid) + '">' +
          '<b>' + esc(s.project) + '</b>' + esc((s._brief || s.title || '').slice(0, 26)) + '</div>';
      }).join('');
      picker.innerHTML = html +
        '<input class="p-free" id="pomoFree" maxlength="60" placeholder="自由任务：打个名字回车就开始（或留空不关联）">';
    } else {
      picker.hidden = true;
    }
  }

  function pomoTaskMs(sid) {
    return (pomoView && pomoView.tasks && pomoView.tasks['sid:' + sid]) || 0;
  }

  // 面板按钮（事件委托；委托挂在常驻 section 上，轮询重绘内部不掉）
  document.getElementById('pomoSection').addEventListener('click', function (ev) {
    if (!LIVE || !window.__worldPomo) return;
    var t = ev.target;
    var d = (curRenderDate || todayKey());
    var actBtn = t.closest && t.closest('[data-act]');
    if (actBtn) {
      var act = actBtn.getAttribute('data-act');
      var send = { pick: null, pause: 'pause', resume: 'resume', skip: 'skip' }[act];
      if (act === 'pick') { pomoPickOpen = !pomoPickOpen; renderPomo(pomoView); return; }
      if (send) window.__worldPomo[send](d).then(renderPomo);
      return;
    }
    var opt = t.closest && t.closest('[data-pick-sid]');
    if (opt) {
      var sid = opt.getAttribute('data-pick-sid');
      var ses = ((lastR && lastR.digest && lastR.digest.sessions) || []).find(function (s) { return s._sid === sid; });
      pomoPickOpen = false;
      window.__worldPomo.start(d, { sid: sid, title: ses ? (ses._brief || ses.title || ses.project) : '' }).then(renderPomo);
    }
  });
  document.getElementById('pomoSection').addEventListener('keydown', function (ev) {
    if (!LIVE || !window.__worldPomo) return;
    if (ev.key !== 'Enter' || !ev.target.classList || !ev.target.classList.contains('p-free')) return;
    var d = (curRenderDate || todayKey());
    pomoPickOpen = false;
    var text = ev.target.value.trim();
    window.__worldPomo.start(d, text ? { text: text } : null).then(renderPomo);
  });

  // 1Hz 轮询主进程（含幂等 tick 结算）——窗口只是镜子，重载/重启不丢时间
  if (LIVE && window.__worldPomo) {
    setInterval(function () {
      if (document.hidden) return; // 切走的时侯省一点，回来下一轮就追上
      window.__worldPomo.poll(curRenderDate || todayKey()).then(function (v) {
        var wasIdle = !pomoView || pomoView.phase === 'idle';
        renderPomo(v);
        // 阶段变化（尤其番茄结算）会影响看板角标/进行中列，联动整体重绘
        if (lastR && (wasIdle !== (v.phase === 'idle'))) render(lastR);
      });
    }, 1000);
  }

  // ---------- 工单调度树（v0.7 重写）：纯渲染层 ----------
  // 数据全部来自主进程 buildOrchView + tree-model（R.orch.tree）。
  // 渲染层不读文件、不做可行性判断 —— 确认/派发/收敛（M2）与开单（M3）
  // 全部只发意图过 __worldOrch 桥，硬闸门与账本写盘都在主进程 actions 层。
  var OT_ENGINE_LABEL = { working: 'working', thinking: 'thinking', juggling: 'juggling', attention: 'attention', sweeping: 'sweeping', carrying: 'carrying', notification: 'notification', idle: 'idle', sleeping: 'sleeping' };
  var orchTab = 'daily'; // 当前 tab；托盘可通过 __worldSetTab 切进来

  // ----- M2/M3 树内写闭环的渲染侧状态（都不是持久数据：账本在主进程，刷新即重建） -----
  var otProblems = [];  // 最近一次写操作返回的错误协议，上守门员栏；成功即清空
  var otBusy = false;   // 一次只许一个写操作在途（按钮整列禁点，防双击双写）
  var otSummary = {};   // 收敛结论输入的草稿（按 tid 记住，重渲染不丢正在敲的字）
  // M3 开单条：目标/agent/cwd 的输入草稿 + 拆单预览的候选与勾选（重渲染不丢；
  // 账本里不存在——确认前的候选单只是内存意图，落账后由主进程重推整树再清空）
  // morph：流体形变标记，只带一帧——otPlanHtml 读完即清，主进程重推的重画不重演入场
  var otPlan = { goal: '', agent: '', cwd: '', drafts: null, checks: [], jev: null, morph: '' };
  // agent 下拉候选（v0.7.8）：null=还没拉 / []=拉过但空。只拉一次，回来后**只填
  // datalist 元素**不整树重画——用户打开下拉/打字中，重画会把原生候选弹层顶掉。
  var otAgentOpts = null;
  // 焦点守卫：主进程推送会整树 innerHTML 重画，正在打字的开单条/收敛输入框会丢焦点、
  // 点按可能被替换帧吞掉——推送帧若在树内输入框持焦时到达，暂存待渲（otPendingTree），
  // 焦点离开树才落；本地意图（勾选/预览/弃单）走 force 直画，不被守卫拦住。
  var otPendingTree = null;

  // 工单卡按状态出操作（与 world/orch/actions.js ACTIONS 对齐；done 无操作）
  var OT_ACTIONS = {
    draft:      [['confirm', '确认', 'go'], ['remove', '删', 'warn']],
    confirmed:  [['dispatch', '派发', 'go'], ['redraft', '回草案', ''], ['remove', '删', 'warn']],
    dispatched: [['converge', '收敛', 'go'], ['fail', '标失败', 'warn'], ['reconfirm', '撤回重确', ''], ['block', '阻塞', 'warn']],
    running:    [['block', '阻塞', 'warn'], ['fail', '标失败', 'warn']],
    failed:     [['reconfirm', '重确', 'go'], ['block', '阻塞', 'warn']],
    blocked:    [['redraft', '改回草案', ''], ['reconfirm', '重确', 'go']],
    done:       [],
  };

  function setTab(next) {
    orchTab = next === 'orch' ? 'orch' : 'daily';
    document.body.classList.toggle('tab-orch', orchTab === 'orch');
    var d = document.getElementById('tabDaily');
    var o = document.getElementById('tabOrch');
    if (d) d.classList.toggle('on', orchTab !== 'orch');
    if (o) o.classList.toggle('on', orchTab === 'orch');
    // 面板本身用 hidden 属性收起（.orch 的 display 由 body.live + :not([hidden]) 控制）
    document.getElementById('panelOrch').hidden = orchTab !== 'orch';
  }

  function otPct(p) { return Math.round((Number(p) || 0) * 100); }
  function otBar(p) { return '<div class="ot-pbar"><i style="width:' + otPct(p) + '%"></i></div>'; }
  function otTime(at) {
    var n = Number(at);
    if (!n) return '--:--:--';
    var d = new Date(n);
    function pad(x) { return (x < 10 ? '0' : '') + x; }
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  // 设计稿（dw-office-tree.html）把 980×620 工作面上的字锁死在 9–13px。
  // vmin 会随窗口缩到 2–5px，所以树区文字全部 calc(Xpx*10*var(--otscale))：
  // 980px 宽窗口 = scale 1（px 原寸），窗口更宽等比放大、更窄等比缩小（有下限防糊）。
  function setOrchScale() {
    var w = (document.documentElement && document.documentElement.clientWidth) || 980;
    var s = Math.max(0.82, Math.min(1.6, w / 980));
    document.documentElement.style.setProperty('--otscale', String(Math.round(s * 100) / 100));
  }
  function renderOrch(o) {
    var bar = document.getElementById('tabBar');
    var panel = document.getElementById('panelOrch');
    var t = o && o.tree;
    // 没有工单 → 整个 tab 不出现（连 tab 按钮都不亮），不占界面
    if (!o || !o.active || !t) {
      bar.hidden = true;
      panel.hidden = true;
      if (orchTab === 'orch') setTab('daily');
      return;
    }
    bar.hidden = false;
    setOrchScale();

    var sum = o.summary || { total: 0, pending: 0, active: 0 };
    document.getElementById('orchSum').innerHTML =
      '共 <b>' + sum.total + '</b> 张 · 待确认 <b>' + sum.pending + '</b> · 在跑 <b>' + sum.active + '</b>' +
      (t.status.inbox ? ' · 未读信封 <b>' + t.status.inbox + '</b>' : '');
    var badge = document.getElementById('orchBadge');
    if (badge) {
      var n = sum.pending || 0;
      badge.hidden = n <= 0;
      badge.textContent = n > 0 ? String(n) : '';
    }

    renderKeeper(t);
    renderTree(t);
    renderLog(t);
    renderStatus(t);
  }

  // ② 守门员栏：三闸门 + 红线常驻。M2 起 additionally 承担写操作的 problems 上墙
  //（actions 层错误协议原样贴出，点一条定位到对应工单卡）。
  function renderKeeper(t) {
    var k = t.keeper || { blocked: 0, failed: 0, cycles: 0, lastAdvice: '' };
    document.getElementById('orchKeeper').innerHTML =
      '<h3>GATE KEEPER</h3><div class="role">三闸门 · on call</div>' +
      '<div class="mom">只在三个时刻发言：<br><span class="m">◇</span> 派发之前<br><span class="m">◇</span> 连续失败<br><span class="m">◇</span> 收敛之前</div>' +
      '<div class="advice"><span class="al">last advice</span>' + esc(k.lastAdvice || 'silent on every routine turn') + '</div>' +
      '<div class="counts">' +
        '<span>阻塞</span><b' + (k.blocked ? ' class="bad"' : '') + '>' + k.blocked + '</b>' +
        '<span>失败</span><b' + (k.failed ? ' class="bad"' : '') + '>' + k.failed + '</b>' +
        '<span>依赖环</span><b' + (k.cycles ? ' class="bad"' : '') + '>' + k.cycles + '</b>' +
        '<span>jev forks</span><b>' + (t.status.jev || 0) + '</b>' +
      '</div>' +
      otProblemsHtml() +
      '<div class="quiet">写入在树内闭环：确认 → 派发 → 收敛</div>' +
      '<div class="oath"><b>从不 spawn 进程。</b><br>派单只写信封；动不动手，那个 agent 自己定。</div>';
  }

  // problems 上墙：code 红字 + reason 正文 + fix 金色指向；带 id/ids 的可点击定位
  function otProblemsHtml() {
    if (!otProblems.length) return '';
    return '<div class="ot-problems">' + otProblems.map(function (p) {
      var tid = p.id || (p.ids && p.ids[0]) || '';
      return '<div class="prob"' + (tid ? ' data-prob-tid="' + esc(tid) + '"' : '') + '>' +
        '<span class="pc">' + esc(p.code || 'problem') + '</span>' +
        '<div class="pr">' + esc(p.reason || '') + '</div>' +
        '<div class="pf">→ ' + esc(p.fix || '') + '</div></div>';
    }).join('') + '</div>';
  }

  // ③ 树主面：MAIN → JEV → spawn → 工单层 → 收敛带
  function renderTree(t, opts) {
    // 焦点守卫：非强制帧（主进程推送）遇上树内输入框持焦 → 暂存，blur 时落（见 otBindOnce）。
    // 树内可输入的元素：开单条三个输入 + 收敛带结论输入——它们正被碰时，画新帧 = 抢键盘。
    if (!opts || !opts.force) {
      var ae = document.activeElement;
      var treeEl = document.getElementById('orchTree');
      if (ae && treeEl && treeEl.contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) {
        otPendingTree = t;
        return;
      }
    }
    otPendingTree = null;
    var html = '<svg class="wires" id="orchWires" aria-hidden="true"></svg>';

    html += '<div class="ot-node ot-main">' +
      '<div class="nh"><span class="who">MAIN · 主会话</span><span>plans + writes code</span></div>' +
      '<div class="goal">' + (t.main.goal
        ? esc(t.main.goal)
        : '<span class="none">还没有立单目标——下方「开单」条打字立单（CLI 等价口：npm run world:orch -- plan "…" --agent &lt;id&gt;）</span>') + '</div>' +
      otBar(t.main.progress) +
      '<div class="pmeta"><span>' + t.main.tickets + ' tickets · max 8</span><span>' + otPct(t.main.progress) + '%</span></div></div>';

    html += '<div class="ot-link"></div>';

    if (t.judgment) {
      html += '<div class="ot-node ot-jev"><div class="nh"><span class="who">JEV · fork layer</span><span class="forks">forks ' + t.judgment.forks + '</span></div>';
      t.judgment.bars.forEach(function (b) {
        html += '<div class="ot-jrow"><span class="jl">' + esc(b.label) + '</span>' +
          '<div class="ot-jbar ot-v-' + b.verdict + '"><i style="width:' + otPct(b.p) + '%"></i></div>' +
          '<span class="jv ot-v-' + b.verdict + '">' + b.p.toFixed(2) + ' ' + b.verdict + '</span></div>';
      });
      html += '<div class="legend"><span class="ot-v-sharp">sharp → 直接立单</span> · <span class="ot-v-split">split → 人来定</span> · no → 不问</div></div>';
    } else {
      html += '<div class="ot-node ot-jev local"><span class="who">JEV</span>judgment · local · 没问 Jev</div>';
    }

    html += '<div class="ot-spawn-line">spawn · max 8 · <b>' + t.main.tickets + ' 张</b> · 按拓扑分列</div>';

    html += '<div class="ot-lanes">';
    t.lanes.forEach(function (lane) {
      html += '<div class="ot-lane">';
      lane.forEach(function (c) { html += tcardHtml(c, t.signals.byTicket[c.id] || {}); });
      html += '</div>';
    });
    html += '</div>';

    // 开单条（M3）：工单层之下、收敛带之上。输入态常设，预览期切勾选态
    html += otPlanHtml();

    if (t.converge.length) {
      html += '<div class="ot-converge"><div class="nh"><span class="who">收敛 · review + verify</span><span>验收过了才算完</span></div>';
      t.converge.forEach(function (c) {
        var acc = c.acceptance || [];
        var checked = c.acceptanceDone || [];
        var done = checked.filter(Boolean).length;
        html += '<div class="ot-crow" data-crow="' + esc(c.id) + '">' +
          '<div class="chead"><span class="cid">' + esc(c.id) + '</span>' +
          '<span class="cchk">验收 ' + done + '/' + acc.length + '</span></div>';
        acc.forEach(function (a, i) {
          html += '<label class="cacc' + (checked[i] ? ' done' : '') + '">' +
            '<input type="checkbox" data-caccept="' + esc(c.id) + ':' + i + '"' + (checked[i] ? ' checked' : '') + '>' +
            '<span>' + esc(a) + '</span></label>';
        });
        // 结论输入草稿存 otSummary（重渲染不丢字）；只有这张卡的验收能勾
        html += '<div class="cdo"><input class="csum" data-csum="' + esc(c.id) + '" ' +
          'placeholder="收敛结论（一句话，写进黑板）" value="' + esc(otSummary[c.id] || '') + '">' +
          '<button class="tact go" data-converge="' + esc(c.id) + '">写入收敛</button></div></div>';
      });
      html += '</div>';
    }

    var el = document.getElementById('orchTree');
    el.innerHTML = html;
    // 依赖连线要等 DOM 落位后量坐标（与旧信封同一个纪律：JS 只在渲染时算一次）。
    // 此刻 panel 可能还 hidden（量出来全是 0）→ 切 tab 时还会再量一次（relayoutOrchWires）。
    requestAnimationFrame(function () { layoutTreeWires(t); });
  }

  function tcardHtml(c, sig) {
    var label = c.statusLabel || c.status;
    var engine = sig.engine || '';
    var on = engine && engine !== 'idle' && engine !== 'sleeping';
    var sigText = sig.stale ? '◌ ' + (OT_ENGINE_LABEL[engine] || '无会话')
      : on ? '● ' + (OT_ENGINE_LABEL[engine] || engine)
      : engine ? '◌ ' + (OT_ENGINE_LABEL[engine] || engine)
      : '○ 无会话';
    var flag = '';
    if (c.status === 'blocked') flag = '<span class="flag blocked">待改派</span>';
    else if (sig.stale) flag = '<span class="flag stale">还没接活</span>';
    var acts = OT_ACTIONS[c.status] || [];
    var actsHtml = acts.length
      ? '<div class="tacts">' + acts.map(function (a) {
          return '<button class="tact ' + a[2] + '" data-tact="' + a[0] + '" data-tid="' + esc(c.id) + '">' + a[1] + '</button>';
        }).join('') + '</div>'
      : '';
    return '<div class="tcard s-' + esc(c.status) + '" data-tid="' + esc(c.id) + '">' + flag +
      '<div class="tid"><span>' + esc(c.id) + '</span><span class="st">' + esc(label) + '</span></div>' +
      '<div class="tname">' + esc(c.title) + '</div>' +
      '<div class="tmeta"><span>' + esc(c.agent || '?') + '</span><span>' + esc(c.action || '') + '</span></div>' +
      otBar(c.progress) +
      '<div class="sig"><span class="' + (on ? 'on' : 'off') + '">' + esc(sigText) + '</span></div>' +
      actsHtml + '</div>';
  }

  // ---------------- M2 树内写闭环：全部走 __worldOrch 桥，渲染层绝不直接 require ----------------

  function otSetBusy(b) {
    otBusy = b;
    var p = document.getElementById('panelOrch');
    if (p) p.classList.toggle('busy', b);
  }

  // 统一出口：成功清 problems（主进程会定向重推 orch 段，整棵面板随后刷新）；
  // 失败把错误协议留上守门员栏并立即重画（不等下一次数据刷新）
  function otHandle(res) {
    otProblems = (res && res.ok) ? []
      : (res && res.problems && res.problems.length) ? res.problems
      : [{ code: 'bridge-down', reason: '编排桥没有回应', fix: '重启组件窗；账本在 ~/.desktop-world/orch/，CLI 仍可操作' }];
    if (lastR && lastR.orch && lastR.orch.tree) renderKeeper(lastR.orch.tree);
    return !!(res && res.ok);
  }

  function otCall(fn, after) {
    if (otBusy) return;
    if (!window.__worldOrch) { otHandle(null); return; }
    otSetBusy(true);
    fn().then(function (res) { otSetBusy(false); otHandle(res); if (after) after(res, true); },
      function () { otSetBusy(false); otHandle(null); if (after) after(null, false); });
  }

  // 工单卡按钮：dispatch 开会话选择器、remove 走删除口，其余直达 actions 层
  function otCardAction(tid, action) {
    if (action === 'dispatch') { otOpenPicker(tid); return; }
    if (action === 'remove') { otRemove(tid); return; }
    otCall(function () {
      var payload = {};
      if (action === 'converge') payload = { summary: otSummary[tid] || '', acceptanceDone: otChecks(tid) };
      return window.__worldOrch.transition(tid, action, payload)
        .then(function (res) { if (res && res.ok && action === 'converge') delete otSummary[tid]; return res; });
    });
  }

  function otRemove(tid) {
    otCall(function () { return window.__worldOrch.remove(tid); });
  }

  // 派发会话选择器：同 agent 同 cwd 置顶（排序在主进程 actions.sessionsFor）
  function otOpenPicker(tid) {
    if (otBusy || !window.__worldOrch) return;
    otSetBusy(true);
    window.__worldOrch.sessions(tid).then(function (res) {
      otSetBusy(false);
      var list = (res && res.sessions) || [];
      var html = '<h4>派发 ' + esc(tid) + ' · 选一个在线会话<span class="x">✕ 关闭</span></h4>';
      if (!list.length) {
        html += '<div class="pkempty">看不到在线会话。编排层不拉进程：先自己开一个 agent 会话，回来再点「派发」。同 agent、同 cwd 的会话会排在最前。</div>';
      }
      list.forEach(function (s) {
        var badges = (s.sameCwd ? '<span class="bdg">同 cwd</span>' : '') +
          (s.sameAgent ? '<span class="bdg">同 agent</span>' : '') +
          (s.headless ? '<span class="bdg">headless</span>' : '');
        html += '<div class="pkrow" data-pick-sid="' + esc(s.id) + '" data-tid="' + esc(tid) + '">' +
          '<div class="l1"><span>' + esc(s.agentName || s.agentId || '?') + badges + '</span><span>' + esc(s.state || '') + '</span></div>' +
          '<div class="l2">' + esc(s.id) + (s.cwd ? ' · ' + esc(s.cwd) : '') + '</div></div>';
      });
      document.getElementById('orchPickerBox').innerHTML = html;
      document.getElementById('orchPicker').hidden = false;
    }, function () { otSetBusy(false); otHandle(null); });
  }
  function otClosePicker() { document.getElementById('orchPicker').hidden = true; }
  function otDispatchTo(tid, sid) {
    otCall(function () {
      return window.__worldOrch.transition(tid, 'dispatch', { sessionId: sid })
        .then(function (res) { if (res && res.ok) otClosePicker(); return res; });
    });
  }

  // 收敛带：验收勾选（立即落账 patch acceptanceDone）+ 结论草稿 + 写入收敛
  function otChecks(tid) {
    var out = [];
    document.querySelectorAll('.ot-crow[data-crow="' + tid + '"] input[data-caccept]')
      .forEach(function (inp) { out.push(!!inp.checked); });
    return out;
  }
  function otToggleAccept(inp) {
    var tid = String(inp.getAttribute('data-caccept') || '').split(':')[0];
    if (!tid) return;
    // 写操作在途时勾选先收住：浏览器已经翻好了打勾，这里翻回去，等重推后按账本重画
    if (otBusy || !window.__worldOrch) { inp.checked = !inp.checked; return; }
    window.__worldOrch.patch(tid, { acceptanceDone: otChecks(tid) }).then(function (res) {
      if (!res || !res.ok) otHandle(res);
    }, function () { otHandle(null); });
  }
  function otConverge(tid) {
    otCall(function () {
      return window.__worldOrch.transition(tid, 'converge', { summary: otSummary[tid] || '', acceptanceDone: otChecks(tid) })
        .then(function (res) { if (res && res.ok) delete otSummary[tid]; return res; });
    });
  }

  // ---------------- M3 树内开单回路：打字目标 → plan 预览 → 勾选 → commitPlan 落账 ----------------
  // 与 CLI cmdPlan 同一条纪律：拆单/闸门/落账全在主进程，渲染层只递目标与勾选结果。

  // 开单条两种形态：无桥（bake/老 preload）整条不出——开不了单的输入条比没有更误导
  function otPlanHtml() {
    if (!window.__worldOrch) return '';
    // 流体形变：preview 是面板态；morphin=胶囊→面板延展帧 / fold=面板→胶囊收拢帧。
    // morph 读完即清——主进程落账重推那帧不带形变，树不重演入场。
    var play = otPlan.drafts && otPlan.morph === 'morphin';
    var cls = 'ot-plan' + (otPlan.drafts ? ' preview' : '') + (otPlan.morph ? ' ' + otPlan.morph : '');
    otPlan.morph = '';
    var html = '<div class="' + cls + '"><div class="nh"><span class="who">开单 · plan</span><span>打字立单 · 闸门照旧</span></div>';
    if (!otPlan.drafts) {
      // agent 候选只拉一次；回来只填 datalist 元素不整树重画（下拉弹层会被重画顶掉）。
      // datalist 是建议不是白名单——手输自由保留，闸门终审照旧。
      if (!otAgentOpts && window.__worldOrch.agents) {
        otAgentOpts = [];
        window.__worldOrch.agents().then(function (res) {
          otAgentOpts = (res && res.agents) || [];
          var dl = document.getElementById('otAgents');
          if (dl) dl.innerHTML = otAgentOptsHtml();
        }).catch(function () { otAgentOpts = []; });
      }
      html += '<div class="prow">' +
        '<input class="pgoal" data-pgoal placeholder="目标：先把 A 做完，然后补 B 的测试…" value="' + esc(otPlan.goal) + '">' +
        '<button class="tact go" data-plan="1">拆单预览</button></div>' +
        '<div class="prow2">agent <input class="popt" data-pagent list="otAgents" placeholder="claude-code" value="' + esc(otPlan.agent) + '">' +
        '<datalist id="otAgents">' + otAgentOptsHtml() + '</datalist>' +
        ' cwd <input class="popt" data-pcwd placeholder="cwd（闸门要用）" value="' + esc(otPlan.cwd) + '"></div>';
    } else {
      var on = otPlan.checks.filter(Boolean).length;
      html += '<div class="prow2">预览 ' + otPlan.drafts.length + ' 张候选 · 勾选要立的单（已选 ' + on + '）</div>';
      // 判断层本次开口了就把意见摆出来（与 keeper advice 同是「建议级」金色；听不听在人）
      if (otPlan.jev) {
        html += '<div class="prow2 pjudge">⚖ ' + (otPlan.jev.source === 'jev' ? 'JEV 判断层' : '本地判断') +
          ' · ' + esc(otPlan.jev.reason) + '</div>';
      }
      // 候选列表自带滚动容器（.pdrafts）：候选一多（8 张）页脚立单/弃单仍钉在
      // 面板里不被 max-height 裁掉——此前页脚被挤出裁切区 = 看得到预览立不了单
      html += '<div class="pdrafts">';
      otPlan.drafts.forEach(function (d, i) {
        var keep = otPlan.checks[i] !== false;
        var meta = (d.agent || '?') + ((d.dependsOn && d.dependsOn.length) ? ' ← ' + d.dependsOn.join('+') : '');
        html += '<label class="pdraft' + (keep ? '' : ' off') + '"' +
          (play ? ' style="animation-delay:' + i * 45 + 'ms"' : '') + '>' +
          '<input type="checkbox" data-pcheck="' + i + '"' + (keep ? ' checked' : '') + '>' +
          '<span class="pd-id">' + esc(d.id) + '</span><span>' + esc(d.title) + '</span>' +
          '<span class="pd-meta">' + esc(meta) + '</span></label>';
      });
      html += '</div><div class="prow pacts"><button class="tact go" data-plan-commit="1">✔ 立单（' + on + '）</button>' +
        '<button class="tact warn" data-plan-cancel="1">✕ 弃掉预览</button></div>';
    }
    return html + '</div>';
  }

  // datalist 候选行：value 是闸门认的 agent id，行文字给人看；非 prefs 探测来源的标注一句
  function otAgentOptsHtml() {
    if (!otAgentOpts || !otAgentOpts.length) return '';
    return otAgentOpts.map(function (a) {
      var label = a.name && a.name !== a.id ? a.name + ' · ' + a.id : a.id;
      return '<option value="' + esc(a.id) + '">' + esc(a.detected === false ? label + '（注册表）' : label) + '</option>';
    }).join('');
  }

  function otRedrawTree() {
    // 本地意图帧（勾选/预览/弃单/落账回执）：force 直画——守卫只拦推送帧，不拦用户自己的动作
    if (lastR && lastR.orch && lastR.orch.tree) renderTree(lastR.orch.tree, { force: true });
  }

  // ① 拆单预览：只读，不落账——主进程不会因此重推，靠 after 回调本地重画树
  function otPlanPreview() {
    var goal = otPlan.goal.trim();
    if (!goal) {
      otHandle({ ok: false, problems: [{ code: 'plan-goal-empty', reason: '目标还是空的', fix: '在开单条先写一句话目标（如「先把 A 做完，然后补 B 的测试」）' }] });
      return;
    }
    otPlan.jev = null;
    otCall(function () {
      return window.__worldOrch.plan(goal, { agent: otPlan.agent.trim(), cwd: otPlan.cwd.trim() })
        .then(function (res) {
          if (res && res.ok) {
            otPlan.drafts = res.drafts || [];
            otPlan.checks = otPlan.drafts.map(function () { return true; });
            // P2：判断层这次开口了就留一句话在预览头部（⚖ 金色建议级；听不听在人）
            otPlan.jev = (res.jev && res.jev.modelTried && res.jev.reason)
              ? { source: res.jev.source === 'jev' ? 'jev' : 'local', reason: String(res.jev.reason) }
              : null;
            otPlan.morph = 'morphin'; // 水滴：输入胶囊 → 预览面板（只此一帧）
          }
          return res;
        });
    }, otRedrawTree);
  }

  // 勾选切的是本地意图，不过桥：只翻 class + 刷新两个计数，整张树不重画（不闪、不丢滚动位）
  function otTogglePlan(inp) {
    var i = Number(inp.getAttribute('data-pcheck'));
    if (!otPlan.drafts || !(i >= 0 && i < otPlan.checks.length)) return;
    otPlan.checks[i] = inp.checked;
    var lab = inp.closest('.pdraft');
    if (lab) lab.classList.toggle('off', !inp.checked);
    var on = otPlan.checks.filter(Boolean).length;
    var btn = document.querySelector('.ot-plan [data-plan-commit]');
    if (btn) btn.textContent = '✔ 立单（' + on + '）';
    var cnt = document.querySelector('.ot-plan .prow2');
    if (cnt) cnt.textContent = '预览 ' + otPlan.drafts.length + ' 张候选 · 勾选要立的单（已选 ' + on + '）';
  }

  // ② 确认立单：勾中的候选原样递主进程——白名单重建/重跑闸门/修依赖/落账全在那边
  function otPlanCommit() {
    if (!otPlan.drafts || otBusy) return;
    var picked = otPlan.drafts.filter(function (d, i) { return otPlan.checks[i] !== false; });
    if (!picked.length) {
      otHandle({ ok: false, problems: [{ code: 'plan-commit-empty', reason: '预览里的候选全被取消了勾选', fix: '至少勾一张再立单，或点 ✕ 弃掉预览' }] });
      return;
    }
    otCall(function () {
      return window.__worldOrch.commitPlan(picked).then(function (res) {
        // 落账成功：清开单草稿回输入态（整树随后由主进程重推刷新，本地先画一帧不等推送）
        if (res && res.ok) { otPlan.goal = ''; otPlan.drafts = null; otPlan.checks = []; otPlan.jev = null; otPlan.morph = 'fold'; }
        return res;
      });
    }, otRedrawTree);
  }

  function otPlanCancel() {
    otPlan.drafts = null; otPlan.checks = []; otPlan.jev = null;
    otPlan.morph = 'fold'; // 水滴收回去：面板 → 胶囊（反向复用同一关键帧）
    otRedrawTree();
  }

  // problems 点击定位：滚到工单卡 + 金色脉冲两拍
  function otLocate(tid) {
    var card = document.querySelector('#orchTree .tcard[data-tid="' + tid + '"]');
    if (!card) return;
    card.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
    card.classList.remove('flash');
    void card.offsetWidth; // 重触动画
    card.classList.add('flash');
    setTimeout(function () { card.classList.remove('flash'); }, 1300);
  }

  // 面板事件代理：一次绑定扛住每次 innerHTML 重渲染
  function otPanelClick(e) {
    var el = e.target;
    if (!el || !el.closest) return;
    var actBtn = el.closest('[data-tact]');
    if (actBtn) {
      var tid = actBtn.getAttribute('data-tid');
      var action = actBtn.getAttribute('data-tact');
      if (action === 'remove') otRemove(tid);
      else otCardAction(tid, action);
      return;
    }
    var prob = el.closest('[data-prob-tid]');
    if (prob) { otLocate(prob.getAttribute('data-prob-tid')); return; }
    var pick = el.closest('[data-pick-sid]');
    if (pick) { otDispatchTo(pick.getAttribute('data-tid'), pick.getAttribute('data-pick-sid')); return; }
    var acc = el.closest('input[data-caccept]');
    if (acc) { otToggleAccept(acc); return; }
    var conv = el.closest('[data-converge]');
    if (conv) { otConverge(conv.getAttribute('data-converge')); return; }
    // 开单条（M3）：预览勾选是本地意图不过桥；三个按钮才发桥调用
    var pcheck = el.closest('input[data-pcheck]');
    if (pcheck) { otTogglePlan(pcheck); return; }
    if (el.closest('[data-plan]')) { otPlanPreview(); return; }
    if (el.closest('[data-plan-commit]')) { otPlanCommit(); return; }
    if (el.closest('[data-plan-cancel]')) { otPlanCancel(); return; }
    // 选择器已是非模态小浮层：不挡工作面，只有它自己的 ✕ 负责关闭
    if (el.closest('.ot-picker .x')) { otClosePicker(); return; }
  }
  function otPanelInput(e) {
    var el = e.target;
    if (!el || !el.closest) return;
    var s = el.closest('input[data-csum]');
    if (s) { otSummary[s.getAttribute('data-csum')] = s.value; return; }
    // 开单条三个输入进 otPlan 草稿（重渲染不丢字）
    if (el.closest('input[data-pgoal]')) otPlan.goal = el.value;
    else if (el.closest('input[data-pagent]')) otPlan.agent = el.value;
    else if (el.closest('input[data-pcwd]')) otPlan.cwd = el.value;
  }
  (function otBindOnce() {
    var panel = document.getElementById('panelOrch');
    if (!panel || !window.__worldOrch) return; // bake/无桥形态：M2 交互整段不存在（只读渲染照旧）
    panel.addEventListener('click', otPanelClick);
    panel.addEventListener('input', otPanelInput);
    // 焦点守卫的落地口：焦点彻底离开树（blank 区/其他面板）时，把暂存的推送帧画出来。
    // 焦点只在树内几个输入框之间挪（relatedTarget 仍在树里）时不落——还在打字。
    panel.addEventListener('focusout', function (e) {
      if (!otPendingTree) return;
      var treeEl = document.getElementById('orchTree');
      if (treeEl && e.relatedTarget && treeEl.contains(e.relatedTarget)) return;
      var t = otPendingTree;
      renderTree(t, { force: true });
    });
  })();

  // 依赖连线（dependsOn 边）：DOM 落位后量一次坐标，画静态贝塞尔，不做动画。
  function layoutTreeWires(t) {
    var svg = document.getElementById('orchWires');
    var host = document.getElementById('orchTree');
    if (!svg || !host || !t) return;
    var hb = host.getBoundingClientRect();
    if (!hb.width) return; // panel 还 hidden：等切 tab 时重量
    function port(id, side) {
      var card = host.querySelector('.tcard[data-tid="' + id + '"]');
      if (!card) return null;
      var b = card.getBoundingClientRect();
      var x = (side === 'left' ? b.left : b.right) - hb.left + host.scrollLeft;
      return { x: x, y: b.top - hb.top + host.scrollTop + b.height / 2 };
    }
    svg.setAttribute('viewBox', '0 0 ' + host.scrollWidth + ' ' + host.scrollHeight);
    svg.textContent = '';
    var ns = 'http://www.w3.org/2000/svg';
    (t.edges || []).forEach(function (e) {
      var a = port(e.from, 'right');
      var b = port(e.to, 'left');
      if (!a || !b) return;
      var mx = (a.x + b.x) / 2;
      var p = document.createElementNS(ns, 'path');
      p.setAttribute('d', 'M ' + a.x + ' ' + a.y + ' C ' + mx + ' ' + a.y + ' ' + mx + ' ' + b.y + ' ' + b.x + ' ' + b.y);
      p.setAttribute('fill', 'none');
      p.setAttribute('stroke', '#2c3442');
      p.setAttribute('stroke-width', '1.2');
      svg.appendChild(p);
    });
  }

  // 切到 orch tab 时重量一次连线（渲染那刻 panel 可能还藏着的补救）。
  function relayoutOrchWires() {
    if (orchTab === 'orch' && lastR && lastR.orch && lastR.orch.tree) layoutTreeWires(lastR.orch.tree);
  }

  // ④ session log：黑板即日志，最新在下（终端语义），自动滚到底
  function renderLog(t) {

  function renderStatus(t) {

  function render(R) {
  lastR = R;
  curRenderDate = (R.meta && R.meta.date) || curRenderDate || todayKey();
  var digest = R.digest || { totals: {}, sessions: [], topTools: [], projects: [], hours: [] };
  var sessions = digest.sessions || [];
  // 会话一句话（LLM 生成，顺序对应 digest.sessions 前 10 条）
  sessions.forEach(function (s, i) { s._brief = R.sessionBriefs && R.sessionBriefs[i] ? R.sessionBriefs[i] : null; });

  // 头部日期
  var d = (R.meta && R.meta.date) || (digest.date || '');
  document.getElementById('date').textContent = d.replace(/-/g, ' / ');
  document.getElementById('weekday').textContent = (R.meta && R.meta.weekday) || digest.weekday || '';

  // 统计 chips
  var chips = [];
  var t = digest.totals || {};
  chips.push(['会话', t.sessions || 0]);
  chips.push(['输入', t.prompts || 0]);
  chips.push(['工具调用', t.toolCalls || 0]);
  // 多 agent 明细（Claude 之外才单独显示）
  (digest.agents || []).forEach(function (a) {
    if (a.agent !== 'claude-code' && a.sessions) chips.push([a.agent === 'codex' ? 'Codex 会话' : a.agent, a.sessions]);
  });
  // 分类维度（学习×N 工作×M…），来自 watch 标注
  if (R.watch && R.watch.categories) {
    Object.keys(R.watch.categories).forEach(function (c) { chips.push([c, R.watch.categories[c]]); });
  }
  (digest.topTools || []).slice(0, 3).forEach(function (x) { chips.push([x.name, x.count]); });
  // 最活跃时段
  var bestH = -1, bestN = 0;
  (digest.hours || []).forEach(function (n, h) { if (n > bestN) { bestN = n; bestH = h; } });
  if (bestH >= 0) chips.push(['高峰', String(bestH).padStart(2, '0') + ':00 档']);
  document.getElementById('stats').innerHTML = chips
    .map(function (c) { return '<span class="chip"><b>' + esc(c[1]) + '</b>' + esc(c[0]) + '</span>'; })
    .join('');

  // 生长世界景观带（v0.4）：有世界数据就展示像素景观，替换掉每日 emoji 生长条
  var world = R.world;
  if (world && world.svg) {
    var wb = document.getElementById('worldband');
    wb.hidden = false;
    document.querySelector('.garden').style.display = 'none';
    document.getElementById('worldScene').innerHTML = world.svg; // svg 由 world/garden/scene.js 生成，来源可信
    var nextTxt = world.next ? '距「' + world.next.icon + world.next.name + '」还差 ' + world.next.remain + 'xp' : '已是最高形态';
    document.getElementById('worldMeta').innerHTML =
      '<span class="stage">' + esc(world.stageIcon + ' ' + world.stageName) + ' · Lv' + world.level + '</span>' +
      '<span>耕种 ' + world.daysActive + ' 天 · 连续 ' + world.streak + ' 天 · 今日 <span class="xpp">+' + world.todayXp + ' xp</span></span>' +
      '<span>' + esc(nextTxt) + '</span>';
  }

  // 桌宠入住景观（仅 live 组件；烘焙壁纸保持纯静态世界）
  var petEl = document.getElementById('petImg');
  var petPetTask = (R.pet && R.pet.taskTitle) || null;
  if (petEl) {
    if (LIVE && world && world.svg && R.pet && R.pet.src) {
      if (petEl.getAttribute('src') !== R.pet.src) petEl.src = R.pet.src;
      petEl.title = R.pet.name || '';
      petEl.hidden = false;
    } else {
      petEl.hidden = true;
    }
  }
  // 角色头顶任务标签：专注进行中且有任务名才出现（番茄 × 场景联动第一层）
  var tagEl = document.getElementById('petTaskTag');
  if (tagEl) {
    if (LIVE && petPetTask && petEl && !petEl.hidden) {
      tagEl.textContent = '🍅 ' + petPetTask;
      tagEl.hidden = false;
    } else {
      tagEl.hidden = true;
    }
  }

  // 随手记（仅 live 组件 + preload 桥存在）：换日/换报时重读当日便签，
  // 正在编辑（有焦点）时绝不覆盖，免得正在输入的人被热刷新顶掉
  if (LIVE && window.__worldNotes) {
    var nd = (R.meta && R.meta.date) || '';
    document.getElementById('notesSection').hidden = false;
    if (nd && nd !== notesDate) {
      notesDate = nd;
      window.__worldNotes.load(nd).then(function (t) {
        if (nd === notesDate && document.activeElement !== notesBodyEl) notesBodyEl.textContent = t || '';
      });
    }
  }

  // 定向学习区：整区仅 live 显示（bake 永远 hidden）；list 只在首个 render 拉一次
  if (LIVE && window.__worldTech) {
    document.getElementById('techSection').hidden = false;
    if (!techInit) {
      techInit = true;
      refreshTechGoals();
    }
  }

  // 学习卡片区：同上，仅 live 显示。独立 studyInit 标记——不能复用 techInit，
  // 那个已被上面的定向学习区抢先置 true，这里就永远拉不到卡片了。
  if (LIVE && window.__worldStudy) {
    document.getElementById('studySection').hidden = false;
    if (!studyInit) {
      studyInit = true;
      refreshStudyCards();
    }
  }

  // 工单看板（v0.7）：仅 live 显示，且只有真有工单时才亮 tab。热刷复用上次的 tab，
  // 不然每 15 分钟刷新会把人正在看的编排视图弹回早报。
  if (LIVE) {
    renderOrch(R.orch);
    if (orchTab === 'orch' && R.orch && R.orch.active) setTab('orch');
  }

  // 生长条：每个完成会话一株 🌿，进行中 🔆，封顶 14 株（无世界数据时的兜底展示）
  var done = sessions.filter(function (s) { return s.status !== '进行中'; }).length;
  var doing = sessions.length - done;
  var plants = '';
  var shownDone = Math.min(done, 14 - Math.min(doing, 3));
  for (var g = 0; g < shownDone; g++) plants += '🌿';
  for (var g2 = 0; g2 < Math.min(doing, 3); g2++) plants += '🔆';
  if (!plants) plants = '<span class="dim">🌱 种子还在等今天的第一场雨</span>';
  document.getElementById('garden').innerHTML = plants;

  // 一句话 + 灵感（右栏底部总结区）
  document.getElementById('oneline').textContent = R.oneline || '今天还没有一句话总结。';
  var genAt = R.meta && R.meta.generatedAt ? new Date(R.meta.generatedAt) : new Date();
  document.getElementById('src').textContent =
    (R.source === 'claude' ? '由本地 Claude 汇总' : '由本地数据汇总') +
    ' · ' + String(genAt.getHours()).padStart(2, '0') + ':' + String(genAt.getMinutes()).padStart(2, '0');
  var ideas = (R.ideas || []).slice(0, 3);
  document.getElementById('ideas').innerHTML = ideas.length
    ? ideas.map(function (x) {
        return '<div class="idea"><span class="bulb">💡</span><span>' + esc(x) + '</span></div>';
      }).join('')
    : '';

  // 专案追踪（v0.5）：被 watch 文件夹的今日/累计进度，最多 2 张紧凑卡
  var wsec = document.getElementById('watchSection');
  var wlist = (R.watch && R.watch.active && R.watch.list) || [];
  if (wlist.length) {
    wlist = wlist.slice().sort(function (a, b) {
      return (b.today - a.today) || (b.days - a.days) || (b.totalSessions - a.totalSessions);
    }).slice(0, 2);
    wsec.style.display = 'flex';
    wsec.innerHTML = wlist.map(wcardHtml).join('');
  } else {
    wsec.style.display = 'none';
    wsec.innerHTML = '';
  }

  function catStyle(cat) {
    var c = CAT_COLORS[cat] || CAT_COLORS.其他;
    return 'color:' + c + ';background:' + c + '22;border:1px solid ' + c + '55;';
  }

  function wcardHtml(w) {
    var max = Math.max.apply(null, [1].concat(w.spark || []));
    var spark = (w.spark || []).map(function (n, idx) {
      var cls = idx === (w.spark.length - 1) ? ' class="today"' : '';
      return '<i' + cls + ' style="height:' + Math.max(2, Math.round((n / max) * 100)) + '%"></i>';
    }).join('');
    var todayTxt = w.today > 0
      ? '<span class="wtoday">今日 ×' + w.today + ' 会话</span>'
      : '<span class="wtoday rest">今日休息</span>';
    return (
      '<div class="wcard"><div class="whead"><span class="wname">' + esc(w.name) + '</span>' +
      '<span class="wcat" style="' + catStyle(w.category) + '">' + esc(w.category) + '</span>' + todayTxt +
      '</div><div class="wmeta">累计 ' + w.days + ' 天 · 连击 ' + w.streak + '🔥 · 共 ' + w.totalSessions + ' 会话 / ' + w.totalToolCalls + ' 次工具</div>' +
      '<div class="spark">' + spark + '</div></div>'
    );
  }

  // 今日卡点 / 技术总结 chips（live 专属，点击打开当日 md）
  var tipsRow = document.getElementById('tipsRow');
  var blockers = R.blockers || [];
  var techTips = R.techTips || [];
  if (LIVE && (blockers.length || techTips.length)) {
    tipsRow.hidden = false;
    var chipB = document.getElementById('blockersChip');
    var chipT = document.getElementById('tipsChip');
    chipB.style.display = blockers.length ? '' : 'none';
    chipT.style.display = techTips.length ? '' : 'none';
    if (blockers.length) {
      chipB.querySelector('.cnt').textContent = '×' + blockers.length;
      chipB.title = blockers.join('\n');
    }
    if (techTips.length) {
      chipT.querySelector('.cnt').textContent = '×' + techTips.length;
      chipT.title = techTips.map(fmtTip).join('\n\n');

    tipsRow.hidden = true;

  // 番茄钟面板（仅 live；R.pomo 是主进程快照，时钟不归渲染层管）
  var pomoSec = document.getElementById('pomoSection');
  if (LIVE && window.__worldPomo) {

  } else if (pomoSec) {
    pomoSec.style.display = 'none';
  }

  // 胶囊摘要数据源（v0.6.6）：收起态唯一可见的信息，全部取现有 live 字段，
  // 每次热刷顺手更新——收起期间 render 照常跑，胶囊数字也会跟着新世界长
  if (LIVE) {
    pillData = {
      world: R.world || null,
      cycles: (R.pomo && R.pomo.cycles) || 0,
      tips: (R.techTips || []).length,

    updatePill();
  }

  // 看板
  var act = sessions.filter(function (s) { return s.status === '进行中' && !(s._sid && pomoDoneSids().indexOf(s._sid) >= 0); });
  var manualDone = sessions.filter(function (s) { return s.status === '进行中' && s._sid && pomoDoneSids().indexOf(s._sid) >= 0; });
  manualDone.forEach(function (s) { s._manualDone = true; });
  var finAll = sessions.filter(function (s) { return s.status !== '进行中'; }).concat(manualDone);
  var fin = finAll.filter(function (s) { return !s.hidden; }); // 「隐藏这条」从看板拿掉（原记录不受影响）
  var hiddenCount = finAll.length - fin.length;
  var MAX_CARDS = 4;
  var body = document.getElementById('boardBody');
  if (!sessions.length) {
    body.innerHTML =
      '<div class="empty-board"><div class="big">🌙</div>' +
      '<div>今天森林很安静<br>还没有 AI 助手会话记录<br>明天再来一起种点新东西吧</div></div>';
  } else {
    // bake（分享 PNG）维持 v0.5 的封顶排版；live 组件里已完成列全量滚动、可隐藏
    var actList, finList;
    if (LIVE) {
      actList = act.slice(0, MAX_CARDS);
      finList = fin;
    } else {
      var capFor = function (l, other) {
        return Math.max(2, Math.min(MAX_CARDS, MAX_CARDS * 2 - Math.min(MAX_CARDS, other.length)));
      };
      actList = act.slice(0, capFor(act, fin));
      finList = fin.slice(0, capFor(fin, act));

    body.innerHTML =
      '<div class="cols">' +
      colHtml('进行中', 'active', act, actList) +

      (LIVE
        ? (act.length > MAX_CARDS
            ? '<div class="overflow-note">进行中仅展示最近 ' + MAX_CARDS + ' 个，共 ' + act.length + ' 个</div>'
            : '')
        : (sessions.length > MAX_CARDS * 2
            ? '<div class="overflow-note">仅展示最近 ' + MAX_CARDS * 2 + ' 个会话，共 ' + sessions.length + ' 个 · 更多见命令行 CLI 报告</div>'
            : ''));

  function colHtml(label, cls, fullList, showList) {
    var cards = showList.map(function (s) {
      var tools = (s.topTools || []).map(function (x) { return x.name; }).join(' / ');
      var meta = [s.durationMin + ' 分钟', s.toolCalls + ' 次工具', tools].filter(Boolean).join(' · ');
      var cat = s.category ? '<span class="cattag" style="' + catStyle(s.category) + '">' + esc(s.category) + '</span>' : '';
      var title = s._brief || s.title; // 优先 LLM 的"干了什么"
      var rawLine = s._brief ? '<div class="raw">' + esc(s.title) + '</div>' : '';
      var hover = esc(s.project + ' · ' + s.title);
      var delBtn = LIVE && cls === 'done' && s._sid
        ? '<button class="del" type="button" data-sid="' + esc(s._sid) + '" title="从今天看板隐藏这条">×</button>'
        : '';
      // 番茄联动：本会话累计的番茄专注时长角标；进行中卡片给「✓ 完成」，点了挪到已完成
      var pomoMs = LIVE && s._sid ? pomoTaskMs(s._sid) : 0;
      var pomoBadge = pomoMs ? ' <span class="pomo-badge" title="今日番茄累计">🍅 ' + esc(fmtMin(pomoMs)) + '</span>' : '';
      var doneBtn = LIVE && cls === 'active' && s._sid
        ? '<button class="del done-toggle" type="button" data-done-sid="' + esc(s._sid) + '" title="手动标记完成">✓</button>'
        : '';
      return (
        '<div class="card" title="' + hover + '">' + delBtn + doneBtn + '<span class="proj">' + esc(s.project) + '</span>' + cat +
        '<div class="title">' + esc(title) + pomoBadge + '</div>' + rawLine +
        '<div class="meta">' + esc(meta) + '</div></div>'
      );
    }).join('');
    return (
      '<div class="col ' + cls + '"><h3><span class="dot"></span>' + label +
      '<span class="count">' + fullList.length + '</span></h3>' +
      '<div class="cards">' + cards + '</div></div>'
    );
  }

  } // render 到此为止

  // 看板交互：隐藏/恢复（事件委托挂在常驻容器上；render 每次重绘内部不会被解绑）
  document.getElementById('boardBody').addEventListener('click', function (ev) {
    if (!LIVE || !window.__worldBoard || !lastR) return;
    var t = ev.target;
    if (t.classList && t.classList.contains('del') && !t.classList.contains('done-toggle')) {
      var sid = t.getAttribute('data-sid');
      if (!sid) return;
      window.__worldBoard.hide(curRenderDate || todayKey(), sid);
      (lastR.digest.sessions || []).forEach(function (s) { if (s._sid === sid) s.hidden = true; });
      render(lastR); // 本地即时重绘；下次热刷新时主进程也会按 dismissed.json 标注
    } else if (t.classList && t.classList.contains('done-toggle')) {
      var dsid = t.getAttribute('data-done-sid');
      if (!dsid || !window.__worldPomo) return;
      window.__worldPomo.completeTask(curRenderDate || todayKey(), dsid).then(function (v) {
        renderPomo(v);
        render(lastR);
      });
    } else if (t.classList && t.classList.contains('restore-hidden')) {
      window.__worldBoard.unhideAll(curRenderDate || todayKey());
      (lastR.digest.sessions || []).forEach(function (s) { s.hidden = false; });
      render(lastR);
    }
  });

  // 卡点/技术总结 chips：点击打开当日 md（主进程白名单拼路径 + shell.openPath）
  if (LIVE && window.__worldOpen) {
    document.getElementById('blockersChip').addEventListener('click', function () {
      window.__worldOpen.md('blockers', curRenderDate || todayKey());
    });
    document.getElementById('tipsChip').addEventListener('click', function () {
      window.__worldOpen.md('tips', curRenderDate || todayKey());
    });
  }

  // 随手记编辑：防抖 400ms 落盘。报表还没回来时（首次打开）按本地今天存档
  if (LIVE && window.__worldNotes && notesBodyEl) {
    var notesSaveTimer = null;
    notesBodyEl.addEventListener('input', function () {
      notesDate = notesDate || todayKey();
      if (notesSaveTimer) clearTimeout(notesSaveTimer);
      notesSaveTimer = setTimeout(function () {
        window.__worldNotes.save(notesDate || todayKey(), notesBodyEl.innerText || '');
      }, 400);
    });
  }

  // 定向学习交互：方向回车出候选 → 点选关键词 → ✔ 落盘（可多轮改方向重出候选）
  if (LIVE && window.__worldTech && techInputEl) {
    techInputEl.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') {
        ev.preventDefault();
        submitTechDirection();
      }
    });
    techPickEl.addEventListener('click', function (ev) {
      var t = ev.target;
      var cand = t.closest && t.closest('.cand');
      if (cand) {
        var kw = cand.getAttribute('data-kw');
        if (techSelected[kw]) {
          delete techSelected[kw];
          cand.classList.remove('on');
        } else {
          techSelected[kw] = true;
          cand.classList.add('on');
        }
        return;
      }
      var save = t.closest && t.closest('.save');
      if (save) {
        var selected = Object.keys(techSelected);
        var hint = techPickEl.querySelector('.thint');
        if (!selected.length) {
          if (hint) hint.textContent = '先点选 ≥1 个关键词再确认';
          return;
        }
        save.disabled = true;
        if (hint) hint.textContent = '落盘中…';
        window.__worldTech.add(techDirection, selected).then(function (res) {
          save.disabled = false;
          if (res && res.ok) {
            techPickEl.hidden = true;
            techPickEl.innerHTML = '';
            techInputEl.textContent = '';
            techSelected = {};
            refreshTechGoals();
          } else if (hint) {
            hint.textContent = (res && res.error) || '保存失败';
          }
        });
      }
    });
  }

  // ---------- 三态生命周期（v0.6.6）：胶囊形态 + 右上角控制组 ----------
  // 主进程是形态的唯一真源（state()）：窗口边界、is-hidden class 都由主进程驱动。
  // 渲染层只报点击、按 push 下来的 ui 态刷新文案。烘焙 PNG（bake）永远没有桥，整段静默。
  var lifePillEl = document.getElementById('lifePill');
  var lifeCtlEl = document.getElementById('lifeCtl');
  var lifeMode = 'open'; // 'open' | 'hidden'（closed = 窗口没了，渲染层不会知道也不关心）
  var pillData = null; // render(R) 每次热刷顺手更新的胶囊摘要数据源

  function updatePill() {
    if (!lifePillEl) return;
    var parts = [];
    if (pillData && pillData.world) {
      parts.push((pillData.world.stageIcon || '🌱') + ' Lv' + (pillData.world.level || 1));
    }
    if (pillData && pillData.cycles) parts.push('🍅' + pillData.cycles);
    if (pillData && pillData.tips) parts.push('💡' + pillData.tips);
    lifePillEl.textContent = parts.length ? parts.join(' · ') : '🌱 Desktop World';
  }

  function updateLifeUi() {
    if (lifePillEl) lifePillEl.title = '点击展开动态桌面';
    updatePill();
  }

  function applyLifeMode() {
    document.body.classList.toggle('is-hidden', lifeMode === 'hidden');
    updateLifeUi();
  }

  // 主进程注入的形态变化（open() 后初始同步、hide()/show()）
  window.__worldSetMode = function (mode) {
    lifeMode = mode === 'hidden' ? 'hidden' : 'open';
    applyLifeMode();
  };

  if (LIVE && window.__worldLive) {
    lifeCtlEl.hidden = false;
    lifePillEl.hidden = false;
    // 启动先对齐主进程真相（startHidden 恢复的胶囊一上来就是对的形态）
    window.__worldLive.ui().then(function (ui) {
      if (ui && typeof ui === 'object') {
        lifeMode = ui.mode === 'hidden' ? 'hidden' : 'open';
        applyLifeMode();
      }
    });
    lifeCtlEl.addEventListener('click', function (ev) {
      var b = ev.target && ev.target.closest ? ev.target.closest('[data-life]') : null;
      if (!b) return;
      var act = b.getAttribute('data-life');
      if (act === 'hide') window.__worldLive.hide();
      else if (act === 'settings') window.__worldLive.openSettings();
    });
    lifePillEl.addEventListener('click', function () {
      window.__worldLive.show();
    });
  }

  render(window.__REPORT__ || {});
  window.__worldRender = render; // live 桌面模式的热刷新入口

  // ---------- tab 交互（v0.7）----------
  // tab 栏与工单看板只在 live 组件存在；bake 形态的 tabBar 保持 hidden。
  var tabBar = document.getElementById('tabBar');
  if (tabBar) {
    tabBar.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('.tab') : null;
      if (!btn) return;
      setTab(btn.getAttribute('data-tab'));
      // 切到调度树时面板刚可见：依赖连线需要以可见 DOM 重量一次坐标
      relayoutOrchWires();
    });
    // 键盘：Ctrl/Cmd + 1/2 在两个 tab 间切（桌面上没有鼠标时也够得着）
    document.addEventListener('keydown', function (e) {
      if (!(e.ctrlKey || e.metaKey)) return;
      if (e.key !== '1' && e.key !== '2') return;
      e.preventDefault();
      setTab(e.key === '2' ? 'orch' : 'daily');
      relayoutOrchWires();
    });
  }
  // 主进程（托盘「工单看板」）切 tab 的入口：与渲染层点按钮走同一个 setTab
  window.__worldSetTab = function (tab) {
    if (tab !== 'orch' || (lastR && lastR.orch && lastR.orch.active)) {
      setTab(tab);
      relayoutOrchWires();
    }
  };
  setTab('daily');
})();
</script>
</body>
</html>
