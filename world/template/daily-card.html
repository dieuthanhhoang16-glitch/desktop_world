<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Desktop World · 今日早报</title>
<style>
  :root {
    --bg-0: #070b1a;
    --bg-1: #0c1430;
    --bg-2: #0f2e33;
    --ink: #e8ecf8;
    --ink-dim: #9aa3c0;
    --ink-faint: #6b7391;
    --card: rgba(255, 255, 255, 0.055);
    --card-edge: rgba(255, 255, 255, 0.10);
    --green: #4ade80;
    --green-soft: rgba(74, 222, 128, 0.16);
    --amber: #fbbf24;
    --amber-soft: rgba(251, 191, 36, 0.12);
    --blue: #7dd3fc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
      "Segoe UI", "Noto Sans CJK SC", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(120vmin 80vmin at 12% 108%, rgba(74, 222, 128, 0.14), transparent 60%),
      radial-gradient(100vmin 70vmin at 96% -8%, rgba(125, 211, 252, 0.12), transparent 55%),
      radial-gradient(150vmin 100vmin at 55% 45%, var(--bg-1), transparent 75%),
      linear-gradient(158deg, var(--bg-0) 0%, var(--bg-2) 130%);
  }
  .stars { position: absolute; inset: 0; opacity: 0.5; }
  .stars i {
    position: absolute; border-radius: 50%; background: #fff;
    width: 0.35vmin; height: 0.35vmin; opacity: 0.55;
  }
  .page { position: absolute; inset: 0; padding: 4.5vmin 5vmin; display: flex; gap: 4vmin; }

  /* ---------- 左栏：日期 + 统计 + 生长世界 ---------- */
  .left { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  .brand { font-size: 1.5vmin; letter-spacing: 0.45em; color: var(--ink-faint); font-weight: 600; }
  .date-row { display: flex; align-items: baseline; gap: 2vmin; margin-top: 1vmin; }
  .date { font-size: 6.8vmin; font-weight: 800; letter-spacing: 0.02em; }
  .weekday { font-size: 2.4vmin; color: var(--ink-dim); font-weight: 500; }

  .stats { display: flex; flex-wrap: wrap; gap: 1.2vmin; margin-top: 2.4vmin; }
  .chip {
    padding: 1vmin 1.7vmin; border-radius: 999px;
    background: var(--card); border: 1px solid var(--card-edge);
    font-size: 1.7vmin; color: var(--ink-dim); white-space: nowrap;
  }
  .chip b { color: var(--ink); font-weight: 700; margin-right: 0.4em; }

  .garden { margin-top: auto; padding-top: 1.6vmin; }
  .garden .label { font-size: 1.5vmin; color: var(--ink-faint); letter-spacing: 0.25em; margin-bottom: 0.9vmin; }
  .garden .row { font-size: 2.8vmin; letter-spacing: 0.15em; line-height: 1.2; }
  .garden .row .dim { opacity: 0.25; }

  /* ---------- 生长世界景观带（v0.4，v0.5 放大为左栏主角）---------- */
  .worldband { margin-top: auto; padding-top: 1.6vmin; }
  .worldband .scene {
    width: 100%; height: 30vmin; border-radius: 1.6vmin; overflow: hidden;
    border: 1px solid var(--card-edge); background: #0b1026;
    box-shadow: 0 1vmin 3vmin rgba(0, 0, 0, 0.35);
  }
  .worldband .scene svg { width: 100%; height: 100%; display: block; }
  .worldband .world-meta {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-top: 1.1vmin; font-size: 1.7vmin; color: var(--ink-dim); gap: 2vmin;
  }
  .worldband .world-meta .stage { font-size: 2vmin; font-weight: 700; color: var(--ink); }
  .worldband .world-meta .xpp { color: var(--green); font-weight: 600; }

  /* ---------- 右栏：看板在上，总结+灵感钉在底 ---------- */
  .board {
    flex: 0 0 41%; max-width: 41%; display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--card-edge); border-radius: 2.2vmin;
    padding: 2.2vmin; min-height: 0; overflow: hidden;
  }
  .board h2 { font-size: 2vmin; font-weight: 700; letter-spacing: 0.12em; flex: 0 0 auto; }
  .board h2 .en { display: block; font-size: 1.25vmin; color: var(--ink-faint); letter-spacing: 0.35em; margin-top: 0.5vmin; font-weight: 600; }

  .board-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; margin-top: 1.8vmin; overflow: hidden; }
  #boardBody { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .cols { display: flex; gap: 1.5vmin; flex: 1 1 auto; min-height: 0; }
  .col { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .col h3 {
    font-size: 1.6vmin; color: var(--ink-dim); font-weight: 600;
    display: flex; align-items: center; gap: 0.7vmin; margin-bottom: 1.1vmin; flex: 0 0 auto;
  }
  .col h3 .dot { width: 0.8vmin; height: 0.8vmin; border-radius: 50%; }
  .col.active h3 .dot { background: var(--green); box-shadow: 0 0 1.2vmin var(--green); }
  .col.done h3 .dot { background: var(--ink-faint); }
  .col h3 .count { margin-left: auto; color: var(--ink-faint); font-weight: 500; }
  .cards { display: flex; flex-direction: column; gap: 1vmin; overflow: hidden; min-height: 0; }
  .card {
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 1.2vmin; padding: 1.2vmin 1.4vmin; flex: 0 0 auto;
  }
  .card .proj {
    display: inline-block; font-size: 1.15vmin; color: var(--blue);
    background: rgba(125, 211, 252, 0.12); border-radius: 0.5vmin;
    padding: 0.3vmin 0.8vmin; margin-bottom: 0.7vmin; letter-spacing: 0.05em;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card .title {
    font-size: 1.6vmin; font-weight: 700; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .raw {
    font-size: 1.2vmin; color: var(--ink-faint); line-height: 1.4; margin-top: 0.5vmin;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .meta { font-size: 1.2vmin; color: var(--ink-faint); margin-top: 0.6vmin; }
  .card .cattag { font-size: 1vmin; margin-left: 0.6vmin; padding: 0.2vmin 0.6vmin; border-radius: 0.45vmin; vertical-align: 0.15vmin; }

  /* ---------- 专案追踪（v0.5，位于看板顶部，最多 2 张紧凑卡）---------- */
  #watchSection { display: none; flex-direction: column; gap: 0.9vmin; margin-bottom: 1.4vmin; flex: 0 0 auto; }
  .wcard {
    background: rgba(255, 255, 255, 0.06); border: 1px solid var(--card-edge);
    border-radius: 1.2vmin; padding: 1vmin 1.3vmin;
  }
  .wcard .whead { display: flex; align-items: baseline; gap: 0.9vmin; }
  .wcard .wname { font-size: 1.6vmin; font-weight: 700; }
  .wcard .wcat { font-size: 1vmin; padding: 0.15vmin 0.7vmin; border-radius: 0.5vmin; white-space: nowrap; }
  .wcard .wtoday { margin-left: auto; font-size: 1.35vmin; color: var(--green); font-weight: 600; white-space: nowrap; }
  .wcard .wtoday.rest { color: var(--ink-faint); font-weight: 400; }
  .wcard .wmeta { font-size: 1.15vmin; color: var(--ink-faint); margin-top: 0.5vmin; }
  .wcard .spark { display: flex; align-items: flex-end; gap: 2px; height: 1.8vmin; margin-top: 0.7vmin; }
  .wcard .spark i { width: 4px; min-height: 2px; background: var(--green); opacity: 0.75; border-radius: 1px 1px 0 0; }
  .wcard .spark i.today { opacity: 1; box-shadow: 0 0 0.6vmin var(--green); }

  .empty-board {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--ink-faint); font-size: 1.8vmin; text-align: center; gap: 1.4vmin; line-height: 1.8;
  }
  .empty-board .big { font-size: 5vmin; }
  .overflow-note { font-size: 1.25vmin; color: var(--ink-faint); margin-top: 1vmin; text-align: right; flex: 0 0 auto; }

  /* ---------- 总结 + 灵感（v0.5 挪到右栏底部）---------- */
  .summary { flex: 0 0 auto; margin-top: 1.8vmin; border-top: 1px dashed var(--card-edge); padding-top: 1.5vmin; }
  .summary .label { font-size: 1.3vmin; color: var(--ink-faint); letter-spacing: 0.3em; margin-bottom: 0.9vmin; }
  .summary .quote { position: relative; padding-left: 2.2vmin; }
  .summary .quote::before {
    content: "“"; position: absolute; top: -1.6vmin; left: 0.2vmin;
    font-size: 5vmin; color: var(--green); opacity: 0.5; font-family: Georgia, serif;
  }
  .summary .oneline { font-size: 2vmin; font-weight: 700; line-height: 1.5; }
  .summary .src { margin-top: 0.6vmin; font-size: 1.2vmin; color: var(--ink-faint); }
  .ideas { margin-top: 1.2vmin; display: flex; flex-direction: column; gap: 0.8vmin; }
  .idea {
    padding: 0.9vmin 1.2vmin; border-radius: 1vmin;
    background: var(--amber-soft); border: 1px solid rgba(251, 191, 36, 0.25);
    font-size: 1.45vmin; line-height: 1.5; color: #fde9c8;
    display: flex; gap: 0.8vmin; align-items: flex-start;
  }
  .idea .bulb { flex: 0 0 auto; }

  /* ---------- 桌宠入住景观（v0.6.1，仅 live 组件显示）---------- */
  .scenewrap { position: relative; }
  #petImg {
    position: absolute; right: 1.2vmin; bottom: 0.6vmin;
    height: 21vmin; width: auto; image-rendering: pixelated; pointer-events: none;
    filter: drop-shadow(0 0.4vmin 0.8vmin rgba(0, 0, 0, 0.35));
  }
  #petImg[hidden] { display: none; }
  /* 番茄专注时角色头顶的任务名标签（仅 live；角色行为可视化的第一层） */
  #petTaskTag {
    position: absolute; right: 0.8vmin; bottom: 20vmin; max-width: 60%;
    padding: 0.4vmin 0.9vmin; border-radius: 1vmin 1vmin 0.2vmin 1vmin;
    background: var(--card); border: 1px solid var(--card-edge);
    font-size: 1.25vmin; color: var(--ink-dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    pointer-events: none;
  }
  #petTaskTag[hidden] { display: none; }

  /* ---------- 随手记（v0.6.1，仅 live 组件；不进烘焙壁纸）---------- */
  .notes { flex: 0 0 auto; margin-top: 1.4vmin; border-top: 1px dashed var(--card-edge); padding-top: 1.2vmin; }
  .notes .label { font-size: 1.3vmin; color: var(--ink-faint); letter-spacing: 0.3em; }
  .notes .label .hint { letter-spacing: 0.08em; opacity: 0.75; }
  .notes-body {
    margin-top: 0.8vmin; min-height: 3.4vmin; max-height: 10.5vmin; overflow-y: auto;
    font-size: 1.6vmin; line-height: 1.55; padding: 0.8vmin 1vmin; border-radius: 0.8vmin;
    background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.07);
    outline: none; white-space: pre-wrap; word-break: break-word;
  }
  .notes-body:focus { border-color: rgba(125, 211, 252, 0.45); }
  .notes-body:empty::before { content: '随手写点什么，只存在你自己电脑上…'; color: var(--ink-faint); }

  /* ---------- 番茄钟（v0.7，仅 live 组件；烘焙壁纸完全不含此板块）---------- */
  body.bake .pomo { display: none !important; }
  .pomo { display: none; } /* bake/非 live 一律不出；live 下由 body.live 选择器打开 */
  body.live .pomo {
    display: block; margin-top: 1.8vmin;
    background: var(--card); border: 1px solid var(--card-edge); border-radius: 1.2vmin;
    padding: 0.9vmin 1.2vmin 1vmin;
    -webkit-app-region: no-drag; /* .page 整面可拖动；横条里的按钮必须点得动 */
  }
  .pomo .p-line1 { display: flex; align-items: baseline; gap: 1vmin; min-height: 2.6vmin; }
  .pomo .p-icon { font-size: 1.9vmin; flex: 0 0 auto; }
  .pomo .p-clock { font-size: 2.2vmin; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
  .pomo .p-clock.paused { opacity: 0.55; }
  .pomo .p-task { font-size: 1.5vmin; color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; min-width: 0; }
  .pomo .p-count { font-size: 1.4vmin; color: var(--ink-faint); flex: 0 0 auto; }
  .pomo .p-btns { flex: 0 0 auto; display: flex; gap: 0.5vmin; }
  .pomo .p-btn {
    border: none; background: transparent; color: var(--ink-dim); cursor: pointer;
    font-size: 1.6vmin; font-family: inherit; padding: 0.2vmin 0.5vmin; border-radius: 0.5vmin;
  }
  .pomo .p-btn:hover { background: rgba(255, 255, 255, 0.12); color: var(--ink); }
  .pomo .p-btn.primary { color: var(--green); font-weight: 700; }
  .pomo .p-bar { margin-top: 0.7vmin; height: 0.32vmin; border-radius: 0.2vmin; background: rgba(255, 255, 255, 0.10); overflow: hidden; }
  .pomo .p-bar i { display: block; height: 100%; background: var(--green); border-radius: 0.2vmin; transition: width 0.9s linear; }
  .pomo.rest .p-bar i { background: var(--blue); }
  .pomo .p-picker { margin-top: 0.8vmin; border-top: 1px dashed var(--card-edge); padding-top: 0.7vmin; }
  .pomo .p-opt {
    display: flex; gap: 0.8vmin; align-items: baseline; padding: 0.45vmin 0.6vmin;
    border-radius: 0.6vmin; font-size: 1.45vmin; color: var(--ink-dim); cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pomo .p-opt:hover { background: rgba(255, 255, 255, 0.08); color: var(--ink); }
  .pomo .p-opt b { color: var(--ink); font-weight: 600; }
  .pomo .p-free {
    width: 100%; margin-top: 0.3vmin; background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.10); border-radius: 0.6vmin; outline: none;
    color: var(--ink); font-size: 1.45vmin; font-family: inherit; padding: 0.5vmin 0.8vmin;
  }
  .pomo .p-free:focus { border-color: rgba(74, 222, 128, 0.5); }

  /* ================= 模式拆分 =================
     body.bake：烘焙壁纸（默认样式，保持今天的样子一个像素不动）
     body.live：动态桌面组件——无卡片化 widget 风，直接"印"在桌面上 */
  body.live {
    background: transparent;
    --card: rgba(7, 11, 26, 0.52);
    --card-edge: rgba(255, 255, 255, 0.16);
    --amber-soft: rgba(7, 11, 26, 0.52);
  }
  body.live .stars { display: none; }
  body.live .page {
    -webkit-app-region: drag; /* 左栏/空白处按住即可拖动窗口 */
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65), 0 0 8px rgba(0, 0, 0, 0.40);
  }
  body.live .board {
    background: transparent; border: none; border-radius: 0; padding: 0.4vmin 0 0;
    -webkit-app-region: no-drag; /* 看板区要留给点击/编辑 */
  }
  body.live .card,
  body.live .wcard { background: rgba(7, 11, 26, 0.5); border-color: rgba(255, 255, 255, 0.13); }
  body.live .idea { border-color: rgba(251, 191, 36, 0.35); }
  body.live .notes-body { background: rgba(7, 11, 26, 0.45); border-color: rgba(255, 255, 255, 0.12); }
  body.live .notes-body:focus { background: rgba(7, 11, 26, 0.6); }

  /* ---------- 已完成列：隐藏按钮 + 全量滚动（v0.6.2，live 专属）---------- */
  .card { position: relative; }
  .card .del {
    position: absolute; top: 0.4vmin; right: 0.6vmin;
    width: 2vmin; height: 2vmin; line-height: 1.8vmin; text-align: center;
    border: none; border-radius: 0.5vmin; padding: 0;
    background: transparent; color: var(--ink-faint);
    font-size: 1.6vmin; font-family: inherit; cursor: pointer;
    opacity: 0; transition: opacity 0.15s;
  }
  .card:hover .del { opacity: 1; }
  .card .del:hover { background: rgba(255, 255, 255, 0.12); color: var(--ink); }
  /* 滚动条：默认完全隐藏，悬停列时浮现 4px 细条，轨道透明（用户反馈 2026-10-05） */
  body.live .col .cards { overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding-right: 0.4vmin; }
  /* 选择器展开把左栏撑高时，压景观带的天空、保住地面与桌宠（bake 形态一像素不动） */
  body.live .worldband { display: flex; flex-direction: column; justify-content: flex-end; min-height: 0; overflow: hidden; }
  body.live .col .cards:hover { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.22) transparent; }
  body.live .col .cards::-webkit-scrollbar { width: 0; background: transparent; }
  body.live .col .cards:hover::-webkit-scrollbar { width: 4px; }
  body.live .col .cards::-webkit-scrollbar-track { background: transparent; }
  body.live .col .cards::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.22); border-radius: 2px; }
  body.live .col .cards::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.36); }
  .hidden-note { font-size: 1.25vmin; color: var(--ink-faint); margin-top: 0.8vmin; text-align: right; flex: 0 0 auto; }
  .hidden-note .restore-hidden { color: var(--blue); cursor: pointer; text-decoration: underline; }
  /* 番茄联动小件：时长角标 + 进行中卡片的「✓ 完成」 */
  .pomo-badge { font-size: 1.2vmin; color: var(--green); font-weight: 600; white-space: nowrap; }
  .card .done-toggle { left: 0.6vmin; right: auto; }
  .card .done-toggle:hover { color: var(--green); }

  /* ---------- 今日卡点 / 技术总结 chips（v0.6.2，仅 live）---------- */
  .tips-row { flex: 0 0 auto; display: flex; gap: 1vmin; margin-top: 1.3vmin; }
  .tips-row[hidden] { display: none; }
  .tipchip {
    flex: 1; text-align: left; cursor: pointer;
    padding: 0.9vmin 1.2vmin; border-radius: 1vmin;
    background: var(--card); border: 1px solid var(--card-edge);
    color: var(--ink); font-size: 1.45vmin; font-weight: 600; font-family: inherit;
    display: flex; align-items: center; gap: 0.6vmin;
  }
  .tipchip .cnt { color: var(--green); font-weight: 700; }
  .tipchip .open { margin-left: auto; font-size: 1.1vmin; color: var(--ink-faint); font-weight: 400; }
  .tipchip:hover { background: rgba(255, 255, 255, 0.09); }
  body.live .tipchip:hover { background: rgba(7, 11, 26, 0.72); }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="page">
  <main class="left">
    <div class="brand">DESKTOP WORLD · 今日早报</div>
    <div class="date-row">
      <div class="date" id="date"></div>
      <div class="weekday" id="weekday"></div>
    </div>

    <div class="stats" id="stats"></div>

    <section class="pomo" id="pomoSection">
      <div class="p-line1">
        <span class="p-icon" id="pomoIcon">🍅</span>
        <span class="p-clock" id="pomoClock"></span>
        <span class="p-task" id="pomoTask"></span>
        <span class="p-count" id="pomoCount"></span>
        <span class="p-btns" id="pomoBtns"></span>
      </div>
      <div class="p-bar" id="pomoBarWrap" hidden><i id="pomoBar" style="width:0%"></i></div>
      <div class="p-picker" id="pomoPicker" hidden></div>
    </section>

    <section class="worldband" id="worldband" hidden>
      <div class="scenewrap">
        <div class="scene" id="worldScene"></div>
        <div id="petTaskTag" hidden></div>
        <img id="petImg" alt="" hidden>
      </div>
      <div class="world-meta" id="worldMeta"></div>
    </section>

    <div class="garden">
      <div class="label">今日生长 TODAY'S GROWTH</div>
      <div class="row" id="garden"></div>
    </div>
  </main>

  <aside class="board">
    <h2>任务看板<span class="en">AGENT BOARD</span></h2>
    <div class="board-body">
      <div id="watchSection"></div>
      <div id="boardBody"></div>
    </div>
    <section class="summary">
      <div class="label">今日总结 DAILY BRIEF</div>
      <div class="quote">
        <div class="oneline" id="oneline"></div>
        <div class="src" id="src"></div>
      </div>
      <div class="ideas" id="ideas"></div>
    </section>
    <div class="tips-row" id="tipsRow" hidden>
      <button class="tipchip" id="blockersChip" type="button"><span>🚧 今日卡点</span><span class="cnt"></span><span class="open">打开 md ↗</span></button>
      <button class="tipchip" id="tipsChip" type="button"><span>💡 技术总结</span><span class="cnt"></span><span class="open">打开 md ↗</span></button>
    </div>
    <section class="notes" id="notesSection" hidden>
      <div class="label">随手记 NOTES <span class="hint">点这里直接写</span></div>
      <div class="notes-body" id="notesBody" contenteditable="plaintext-only" spellcheck="false"></div>
    </section>
  </aside>
</div>

<script>
(function () {
  // 模式拆分：bake = 烘焙壁纸（注入了 window.__REPORT__，保持卡片形态）；
  //           live = 动态桌面组件（无 __REPORT__，无卡片化 widget + 桌宠 + 随手记）
  var LIVE = !window.__REPORT__;
  document.body.className = LIVE ? 'live' : 'bake';

  // 星星只铺一次底；render 支持反复调用（live 桌面模式每 15 分钟热刷新）
  var starsEl = document.getElementById('stars');
  if (!starsEl.childElementCount) {
    for (var i = 0; i < 90; i++) {
      var s = document.createElement('i');
      s.style.left = (Math.random() * 100).toFixed(2) + '%';
      s.style.top = (Math.random() * 100).toFixed(2) + '%';
      s.style.opacity = (0.15 + Math.random() * 0.5).toFixed(2);
      starsEl.appendChild(s);
    }
  }

  var CAT_COLORS = { 学习: '#7dd3fc', 工作: '#4ade80', 生活: '#fbbf24', 开源: '#ff9ec6', 其他: '#9aa3c0' };
  var notesDate = null; // 随手记当前已加载的日期键（live 模式）
  var notesBodyEl = document.getElementById('notesBody');
  var lastR = null; // 最近一次渲染的完整报告（隐藏/恢复后的本地重绘用）
  var curRenderDate = null; // 当前渲染日期（隐藏会话 / 打开当日 md 的日期键）

  function todayKey() {
    var n = new Date();
    return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
  }

  // HTML 转义（renderPomo 与 render 共用；v0.6.3.3 之前它嵌在 render 里，
  // 点击「▶ 开始」开任务选择器时抛 esc is not defined，选择器只展开了一条空虚线）
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ---------- 番茄钟（UI 只是主进程状态的镜子；时钟与写盘全在主进程）----------
  var pomoView = null; // 最近一次主进程快照（render(R.pomo) 与 1Hz 轮询共用）
  var pomoPickOpen = false; // 任务选择器展开态（热刷新不打断正在选的人）

  function pomoDoneSids() {
    return (pomoView && pomoView.doneSids) || [];
  }

  function fmtMMSS(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }
  function fmtMin(ms) {
    var m = Math.round(ms / 60000);
    return m >= 60 ? (m / 60).toFixed(1) + 'h' : m + ' 分钟';
  }

  function renderPomo(v) {
    pomoView = v || { phase: 'idle', remainMs: 0, totalMs: 0, task: null, cycles: 0, focusMs: 0, tasks: {}, doneSids: [] };
    var sec = document.getElementById('pomoSection');
    if (!sec) return;
    sec.style.display = '';
    var clock = document.getElementById('pomoClock');
    var task = document.getElementById('pomoTask');
    var count = document.getElementById('pomoCount');
    var btns = document.getElementById('pomoBtns');
    var barWrap = document.getElementById('pomoBarWrap');
    var bar = document.getElementById('pomoBar');
    var ph = pomoView.phase;
    var running = ph === 'focus' || ph === 'break';
    var paused = ph === 'focus-paused' || ph === 'break-paused';

    sec.classList.toggle('rest', ph.indexOf('break') === 0);
    clock.classList.toggle('paused', paused);
    clock.textContent = running || paused ? fmtMMSS(pomoView.remainMs) : '';
    task.textContent = running || paused
      ? (ph.indexOf('break') === 0 ? '休息一下 ☕' : ('· ' + (pomoView.task ? pomoView.task.title : '自由专注')))
      : '开始一个番茄';
    count.textContent = pomoView.cycles ? '×' + pomoView.cycles : '';

    var b = [];
    if (ph === 'idle') {
      b.push('<button class="p-btn primary" data-act="pick" type="button">▶ 开始</button>');
    } else if (paused) {
      b.push('<button class="p-btn primary" data-act="resume" type="button">▶ 继续</button>');
      b.push('<button class="p-btn" data-act="skip" type="button">⏭ 跳过</button>');
    } else {
      b.push('<button class="p-btn" data-act="pause" type="button">⏸ 暂停</button>');
      b.push('<button class="p-btn" data-act="skip" type="button">⏭ 跳过</button>');
    }
    btns.innerHTML = b.join('');

    if (running || paused) {
      barWrap.hidden = false;
      var frac = pomoView.totalMs > 0 ? 1 - pomoView.remainMs / pomoView.totalMs : 0;
      bar.style.width = (Math.max(0, Math.min(1, frac)) * 100).toFixed(1) + '%';
    } else {
      barWrap.hidden = true;
    }

    // 任务选择器（idle 点「开始」后展开）：进行中会话卡 + 自由任务 + 不关联
    var picker = document.getElementById('pomoPicker');
    if (pomoPickOpen && ph === 'idle') {
      picker.hidden = false;
      var ses = ((lastR && lastR.digest && lastR.digest.sessions) || []).filter(function (s) {
        return s.status === '进行中' && !s.hidden && s._sid;
      });
      var html = ses.map(function (s, i) {
        return '<div class="p-opt" data-pick-sid="' + esc(s._sid) + '">' +
          '<b>' + esc(s.project) + '</b>' + esc((s._brief || s.title || '').slice(0, 26)) + '</div>';
      }).join('');
      picker.innerHTML = html +
        '<input class="p-free" id="pomoFree" maxlength="60" placeholder="自由任务：打个名字回车就开始（或留空不关联）">';
    } else {
      picker.hidden = true;
    }
  }

  function pomoTaskMs(sid) {
    return (pomoView && pomoView.tasks && pomoView.tasks['sid:' + sid]) || 0;
  }

  // 面板按钮（事件委托；委托挂在常驻 section 上，轮询重绘内部不掉）
  document.getElementById('pomoSection').addEventListener('click', function (ev) {
    if (!LIVE || !window.__worldPomo) return;
    var t = ev.target;
    var d = (curRenderDate || todayKey());
    var actBtn = t.closest && t.closest('[data-act]');
    if (actBtn) {
      var act = actBtn.getAttribute('data-act');
      var send = { pick: null, pause: 'pause', resume: 'resume', skip: 'skip' }[act];
      if (act === 'pick') { pomoPickOpen = !pomoPickOpen; renderPomo(pomoView); return; }
      if (send) window.__worldPomo[send](d).then(renderPomo);
      return;
    }
    var opt = t.closest && t.closest('[data-pick-sid]');
    if (opt) {
      var sid = opt.getAttribute('data-pick-sid');
      var ses = ((lastR && lastR.digest && lastR.digest.sessions) || []).find(function (s) { return s._sid === sid; });
      pomoPickOpen = false;
      window.__worldPomo.start(d, { sid: sid, title: ses ? (ses._brief || ses.title || ses.project) : '' }).then(renderPomo);
    }
  });
  document.getElementById('pomoSection').addEventListener('keydown', function (ev) {
    if (!LIVE || !window.__worldPomo) return;
    if (ev.key !== 'Enter' || !ev.target.classList || !ev.target.classList.contains('p-free')) return;
    var d = (curRenderDate || todayKey());
    pomoPickOpen = false;
    var text = ev.target.value.trim();
    window.__worldPomo.start(d, text ? { text: text } : null).then(renderPomo);
  });

  // 1Hz 轮询主进程（含幂等 tick 结算）——窗口只是镜子，重载/重启不丢时间
  if (LIVE && window.__worldPomo) {
    setInterval(function () {
      if (document.hidden) return; // 切走的时侯省一点，回来下一轮就追上
      window.__worldPomo.poll(curRenderDate || todayKey()).then(function (v) {
        var wasIdle = !pomoView || pomoView.phase === 'idle';
        renderPomo(v);
        // 阶段变化（尤其番茄结算）会影响看板角标/进行中列，联动整体重绘
        if (lastR && (wasIdle !== (v.phase === 'idle'))) render(lastR);
      });
    }, 1000);
  }

  function render(R) {
  lastR = R;
  curRenderDate = (R.meta && R.meta.date) || curRenderDate || todayKey();
  var digest = R.digest || { totals: {}, sessions: [], topTools: [], projects: [], hours: [] };
  var sessions = digest.sessions || [];
  // 会话一句话（LLM 生成，顺序对应 digest.sessions 前 10 条）
  sessions.forEach(function (s, i) { s._brief = R.sessionBriefs && R.sessionBriefs[i] ? R.sessionBriefs[i] : null; });

  // 头部日期
  var d = (R.meta && R.meta.date) || (digest.date || '');
  document.getElementById('date').textContent = d.replace(/-/g, ' / ');
  document.getElementById('weekday').textContent = (R.meta && R.meta.weekday) || digest.weekday || '';

  // 统计 chips
  var chips = [];
  var t = digest.totals || {};
  chips.push(['会话', t.sessions || 0]);
  chips.push(['输入', t.prompts || 0]);
  chips.push(['工具调用', t.toolCalls || 0]);
  // 多 agent 明细（Claude 之外才单独显示）
  (digest.agents || []).forEach(function (a) {
    if (a.agent !== 'claude-code' && a.sessions) chips.push([a.agent === 'codex' ? 'Codex 会话' : a.agent, a.sessions]);
  });
  // 分类维度（学习×N 工作×M…），来自 watch 标注
  if (R.watch && R.watch.categories) {
    Object.keys(R.watch.categories).forEach(function (c) { chips.push([c, R.watch.categories[c]]); });
  }
  (digest.topTools || []).slice(0, 3).forEach(function (x) { chips.push([x.name, x.count]); });
  // 最活跃时段
  var bestH = -1, bestN = 0;
  (digest.hours || []).forEach(function (n, h) { if (n > bestN) { bestN = n; bestH = h; } });
  if (bestH >= 0) chips.push(['高峰', String(bestH).padStart(2, '0') + ':00 档']);
  document.getElementById('stats').innerHTML = chips
    .map(function (c) { return '<span class="chip"><b>' + esc(c[1]) + '</b>' + esc(c[0]) + '</span>'; })
    .join('');

  // 生长世界景观带（v0.4）：有世界数据就展示像素景观，替换掉每日 emoji 生长条
  var world = R.world;
  if (world && world.svg) {
    var wb = document.getElementById('worldband');
    wb.hidden = false;
    document.querySelector('.garden').style.display = 'none';
    document.getElementById('worldScene').innerHTML = world.svg; // svg 由 world/garden/scene.js 生成，来源可信
    var nextTxt = world.next ? '距「' + world.next.icon + world.next.name + '」还差 ' + world.next.remain + 'xp' : '已是最高形态';
    document.getElementById('worldMeta').innerHTML =
      '<span class="stage">' + esc(world.stageIcon + ' ' + world.stageName) + ' · Lv' + world.level + '</span>' +
      '<span>耕种 ' + world.daysActive + ' 天 · 连续 ' + world.streak + ' 天 · 今日 <span class="xpp">+' + world.todayXp + ' xp</span></span>' +
      '<span>' + esc(nextTxt) + '</span>';
  }

  // 桌宠入住景观（仅 live 组件；烘焙壁纸保持纯静态世界）
  var petEl = document.getElementById('petImg');
  var petPetTask = (R.pet && R.pet.taskTitle) || null;
  if (petEl) {
    if (LIVE && world && world.svg && R.pet && R.pet.src) {
      if (petEl.getAttribute('src') !== R.pet.src) petEl.src = R.pet.src;
      petEl.title = R.pet.name || '';
      petEl.hidden = false;
    } else {
      petEl.hidden = true;
    }
  }
  // 角色头顶任务标签：专注进行中且有任务名才出现（番茄 × 场景联动第一层）
  var tagEl = document.getElementById('petTaskTag');
  if (tagEl) {
    if (LIVE && petPetTask && petEl && !petEl.hidden) {
      tagEl.textContent = '🍅 ' + petPetTask;
      tagEl.hidden = false;
    } else {
      tagEl.hidden = true;
    }
  }

  // 随手记（仅 live 组件 + preload 桥存在）：换日/换报时重读当日便签，
  // 正在编辑（有焦点）时绝不覆盖，免得光标乱跳
  if (LIVE && window.__worldNotes) {
    var nd = (R.meta && R.meta.date) || '';
    document.getElementById('notesSection').hidden = false;
    if (nd && nd !== notesDate) {
      notesDate = nd;
      window.__worldNotes.load(nd).then(function (t) {
        if (nd === notesDate && document.activeElement !== notesBodyEl) notesBodyEl.textContent = t || '';
      });
    }
  }

  // 生长条：每个完成会话一株 🌿，进行中 🔆，封顶 14 株（无世界数据时的兜底展示）
  var done = sessions.filter(function (s) { return s.status !== '进行中'; }).length;
  var doing = sessions.length - done;
  var plants = '';
  var shownDone = Math.min(done, 14 - Math.min(doing, 3));
  for (var g = 0; g < shownDone; g++) plants += '🌿';
  for (var g2 = 0; g2 < Math.min(doing, 3); g2++) plants += '🔆';
  if (!plants) plants = '<span class="dim">🌱 种子还在等今天的第一场雨</span>';
  document.getElementById('garden').innerHTML = plants;

  // 一句话 + 灵感（右栏底部总结区）
  document.getElementById('oneline').textContent = R.oneline || '今天还没有一句话总结。';
  var genAt = R.meta && R.meta.generatedAt ? new Date(R.meta.generatedAt) : new Date();
  document.getElementById('src').textContent =
    (R.source === 'claude' ? '由本地 Claude 汇总' : '由本地数据汇总') +
    ' · ' + String(genAt.getHours()).padStart(2, '0') + ':' + String(genAt.getMinutes()).padStart(2, '0');
  var ideas = (R.ideas || []).slice(0, 3);
  document.getElementById('ideas').innerHTML = ideas.length
    ? ideas.map(function (x) {
        return '<div class="idea"><span class="bulb">💡</span><span>' + esc(x) + '</span></div>';
      }).join('')
    : '';

  // 专案追踪（v0.5）：被 watch 文件夹的今日/累计进度，最多 2 张紧凑卡
  var wsec = document.getElementById('watchSection');
  var wlist = (R.watch && R.watch.active && R.watch.list) || [];
  if (wlist.length) {
    wlist = wlist.slice().sort(function (a, b) {
      return (b.today - a.today) || (b.days - a.days) || (b.totalSessions - a.totalSessions);
    }).slice(0, 2);
    wsec.style.display = 'flex';
    wsec.innerHTML = wlist.map(wcardHtml).join('');
  } else {
    wsec.style.display = 'none';
    wsec.innerHTML = '';
  }

  function catStyle(cat) {
    var c = CAT_COLORS[cat] || CAT_COLORS.其他;
    return 'color:' + c + ';background:' + c + '22;border:1px solid ' + c + '55;';
  }

  function wcardHtml(w) {
    var max = Math.max.apply(null, [1].concat(w.spark || []));
    var spark = (w.spark || []).map(function (n, idx) {
      var cls = idx === (w.spark.length - 1) ? ' class="today"' : '';
      return '<i' + cls + ' style="height:' + Math.max(2, Math.round((n / max) * 100)) + '%"></i>';
    }).join('');
    var todayTxt = w.today > 0
      ? '<span class="wtoday">今日 ×' + w.today + ' 会话</span>'
      : '<span class="wtoday rest">今日休息</span>';
    return (
      '<div class="wcard"><div class="whead"><span class="wname">' + esc(w.name) + '</span>' +
      '<span class="wcat" style="' + catStyle(w.category) + '">' + esc(w.category) + '</span>' + todayTxt +
      '</div><div class="wmeta">累计 ' + w.days + ' 天 · 连击 ' + w.streak + '🔥 · 共 ' + w.totalSessions + ' 会话 / ' + w.totalToolCalls + ' 次工具</div>' +
      '<div class="spark">' + spark + '</div></div>'
    );
  }

  // 今日卡点 / 技术总结 chips（live 专属，点击打开当日 md）
  var tipsRow = document.getElementById('tipsRow');
  var blockers = R.blockers || [];
  var techTips = R.techTips || [];
  if (LIVE && (blockers.length || techTips.length)) {
    tipsRow.hidden = false;
    var chipB = document.getElementById('blockersChip');
    var chipT = document.getElementById('tipsChip');
    chipB.style.display = blockers.length ? '' : 'none';
    chipT.style.display = techTips.length ? '' : 'none';
    if (blockers.length) {
      chipB.querySelector('.cnt').textContent = '×' + blockers.length;
      chipB.title = blockers.join('\n');
    }
    if (techTips.length) {
      chipT.querySelector('.cnt').textContent = '×' + techTips.length;
      chipT.title = techTips.join('\n');
    }
  } else {
    tipsRow.hidden = true;
  }

  // 番茄钟面板（仅 live；R.pomo 是主进程快照，时钟不归渲染层管）
  var pomoSec = document.getElementById('pomoSection');
  if (LIVE && window.__worldPomo) {
    renderPomo(R.pomo || null);
  } else if (pomoSec) {
    pomoSec.style.display = 'none';
  }

  // 看板
  var act = sessions.filter(function (s) { return s.status === '进行中' && !(s._sid && pomoDoneSids().indexOf(s._sid) >= 0); });
  var manualDone = sessions.filter(function (s) { return s.status === '进行中' && s._sid && pomoDoneSids().indexOf(s._sid) >= 0; });
  manualDone.forEach(function (s) { s._manualDone = true; });
  var finAll = sessions.filter(function (s) { return s.status !== '进行中'; }).concat(manualDone);
  var fin = finAll.filter(function (s) { return !s.hidden; }); // 「隐藏这条」从看板拿掉（原记录不受影响）
  var hiddenCount = finAll.length - fin.length;
  var MAX_CARDS = 4;
  var body = document.getElementById('boardBody');
  if (!sessions.length) {
    body.innerHTML =
      '<div class="empty-board"><div class="big">🌙</div>' +
      '<div>今天森林很安静<br>还没有 AI 助手会话记录<br>明天再来一起种点新东西吧</div></div>';
  } else {
    // bake（分享 PNG）维持 v0.5 的封顶排版；live 组件里已完成列全量滚动、可隐藏
    var actList, finList;
    if (LIVE) {
      actList = act.slice(0, MAX_CARDS);
      finList = fin;
    } else {
      var capFor = function (l, other) {
        return Math.max(2, Math.min(MAX_CARDS, MAX_CARDS * 2 - Math.min(MAX_CARDS, other.length)));
      };
      actList = act.slice(0, capFor(act, fin));
      finList = fin.slice(0, capFor(fin, act));
    }
    body.innerHTML =
      '<div class="cols">' +
      colHtml('进行中', 'active', act, actList) +
      colHtml('已完成', 'done', fin, finList) +
      '</div>' +
      (LIVE && hiddenCount
        ? '<div class="hidden-note">已隐藏 ' + hiddenCount + ' 条 · <span class="restore-hidden">全部恢复</span></div>'
        : '') +
      (LIVE
        ? (act.length > MAX_CARDS
            ? '<div class="overflow-note">进行中仅展示最近 ' + MAX_CARDS + ' 个，共 ' + act.length + ' 个</div>'
            : '')
        : (sessions.length > MAX_CARDS * 2
            ? '<div class="overflow-note">仅展示最近 ' + MAX_CARDS * 2 + ' 个会话，共 ' + sessions.length + ' 个 · 更多见命令行 CLI 报告</div>'
            : ''));
  }

  function colHtml(label, cls, fullList, showList) {
    var cards = showList.map(function (s) {
      var tools = (s.topTools || []).map(function (x) { return x.name; }).join(' / ');
      var meta = [s.durationMin + ' 分钟', s.toolCalls + ' 次工具', tools].filter(Boolean).join(' · ');
      var cat = s.category ? '<span class="cattag" style="' + catStyle(s.category) + '">' + esc(s.category) + '</span>' : '';
      var title = s._brief || s.title; // 优先 LLM 的"干了什么"
      var rawLine = s._brief ? '<div class="raw">' + esc(s.title) + '</div>' : '';
      var hover = esc(s.project + ' · ' + s.title);
      var delBtn = LIVE && cls === 'done' && s._sid
        ? '<button class="del" type="button" data-sid="' + esc(s._sid) + '" title="从今天看板隐藏这条">×</button>'
        : '';
      // 番茄联动：本会话累计的番茄专注时长角标；进行中卡片给「✓ 完成」，点了挪到已完成
      var pomoMs = LIVE && s._sid ? pomoTaskMs(s._sid) : 0;
      var pomoBadge = pomoMs ? ' <span class="pomo-badge" title="今日番茄累计">🍅 ' + esc(fmtMin(pomoMs)) + '</span>' : '';
      var doneBtn = LIVE && cls === 'active' && s._sid
        ? '<button class="del done-toggle" type="button" data-done-sid="' + esc(s._sid) + '" title="手动标记完成">✓</button>'
        : '';
      return (
        '<div class="card" title="' + hover + '">' + delBtn + doneBtn + '<span class="proj">' + esc(s.project) + '</span>' + cat +
        '<div class="title">' + esc(title) + pomoBadge + '</div>' + rawLine +
        '<div class="meta">' + esc(meta) + '</div></div>'
      );
    }).join('');
    return (
      '<div class="col ' + cls + '"><h3><span class="dot"></span>' + label +
      '<span class="count">' + fullList.length + '</span></h3>' +
      '<div class="cards">' + cards + '</div></div>'
    );
  }

  } // render 到此为止

  // 看板交互：隐藏/恢复（事件委托挂在常驻容器上；render 每次重绘内部不会被解绑）
  document.getElementById('boardBody').addEventListener('click', function (ev) {
    if (!LIVE || !window.__worldBoard || !lastR) return;
    var t = ev.target;
    if (t.classList && t.classList.contains('del') && !t.classList.contains('done-toggle')) {
      var sid = t.getAttribute('data-sid');
      if (!sid) return;
      window.__worldBoard.hide(curRenderDate || todayKey(), sid);
      (lastR.digest.sessions || []).forEach(function (s) { if (s._sid === sid) s.hidden = true; });
      render(lastR); // 本地即时重绘；下次热刷新时主进程也会按 dismissed.json 标注
    } else if (t.classList && t.classList.contains('done-toggle')) {
      var dsid = t.getAttribute('data-done-sid');
      if (!dsid || !window.__worldPomo) return;
      window.__worldPomo.completeTask(curRenderDate || todayKey(), dsid).then(function (v) {
        renderPomo(v);
        render(lastR);
      });
    } else if (t.classList && t.classList.contains('restore-hidden')) {
      window.__worldBoard.unhideAll(curRenderDate || todayKey());
      (lastR.digest.sessions || []).forEach(function (s) { s.hidden = false; });
      render(lastR);
    }
  });

  // 卡点/技术总结 chips：点击打开当日 md（主进程白名单拼路径 + shell.openPath）
  if (LIVE && window.__worldOpen) {
    document.getElementById('blockersChip').addEventListener('click', function () {
      window.__worldOpen.md('blockers', curRenderDate || todayKey());
    });
    document.getElementById('tipsChip').addEventListener('click', function () {
      window.__worldOpen.md('tips', curRenderDate || todayKey());
    });
  }

  // 随手记编辑：防抖 400ms 落盘。报表还没回来时（首次打开）按本地今天存档
  if (LIVE && window.__worldNotes && notesBodyEl) {
    var notesSaveTimer = null;
    notesBodyEl.addEventListener('input', function () {
      notesDate = notesDate || todayKey();
      if (notesSaveTimer) clearTimeout(notesSaveTimer);
      notesSaveTimer = setTimeout(function () {
        window.__worldNotes.save(notesDate || todayKey(), notesBodyEl.innerText || '');
      }, 400);
    });
  }

  render(window.__REPORT__ || {});
  window.__worldRender = render; // live 桌面模式的热刷新入口
})();
</script>
</body>
</html>
